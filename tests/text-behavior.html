<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text Behavior Smoke</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    iframe {
      width: 1280px;
      height: 900px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    pre {
      max-width: 1280px;
      white-space: pre-wrap;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: .75rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>Text Behavior Smoke</h1>
  <pre id="result">Running...</pre>
  <iframe id="textFrame" src="../text/index.html"></iframe>

  <script>
    const result = document.getElementById('result');
    const frame = document.getElementById('textFrame');

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Опитуємо через setTimeout, а не requestAnimationFrame: під
    // --virtual-time-budget (headless smoke) щільний rAF-цикл не дає віртуальному
    // годиннику рухатися рівномірно — очікування то «згорало» миттєво з
    // таймаутом, то не завершувалося взагалі. Решта smoke-сторінок опитує так само.
    function waitFor(predicate, label, timeout = 6000) {
      const started = performance.now();
      return new Promise((resolve, reject) => {
        function tick() {
          let ok = false;
          try { ok = !!predicate(); } catch { ok = false; }
          if (ok) return resolve();
          if (performance.now() - started > timeout) return reject(new Error(`Timed out waiting for ${label}`));
          setTimeout(tick, 50);
        }
        tick();
      });
    }

    function check(label, ok) {
      return { label, ok: !!ok };
    }

    // Дістає одну частину з .docx (це ZIP) без сторонніх бібліотек — потрібно,
    // щоб перевіряти сам XML, а не лише факт, що файл створився.
    async function readDocxPart(blob, wanted) {
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const u16 = at => bytes[at] | (bytes[at + 1] << 8);
      const u32 = at => (bytes[at] | (bytes[at + 1] << 8) | (bytes[at + 2] << 16) | (bytes[at + 3] << 24)) >>> 0;

      let eocd = -1;
      for (let i = bytes.length - 22; i >= 0; i--) if (u32(i) === 0x06054B50) { eocd = i; break; }
      if (eocd < 0) return '';

      const count = u16(eocd + 10);
      let at = u32(eocd + 16);
      for (let i = 0; i < count; i++) {
        const method = u16(at + 10);
        const compressed = u32(at + 20);
        const nameLen = u16(at + 28);
        const extraLen = u16(at + 30);
        const commentLen = u16(at + 32);
        const offset = u32(at + 42);
        const name = new TextDecoder().decode(bytes.subarray(at + 46, at + 46 + nameLen));
        if (name === wanted) {
          const start = offset + 30 + u16(offset + 26) + u16(offset + 28);
          const raw = bytes.subarray(start, start + compressed);
          if (method === 0) return new TextDecoder().decode(raw);
          const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          return new TextDecoder().decode(new Uint8Array(await new Response(stream).arrayBuffer()));
        }
        at += 46 + nameLen + extraLen + commentLen;
      }
      return '';
    }

    function pageContents(doc) {
      return Array.from(doc.querySelectorAll('#editor .page-content'));
    }

    function isOverflowing(el) {
      return !!el && el.scrollHeight > el.clientHeight + 1;
    }

    function setCaretAtStart(win, node) {
      const range = win.document.createRange();
      range.selectNodeContents(node);
      range.collapse(true);
      const sel = win.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function setCaretAtEnd(win, node) {
      const range = win.document.createRange();
      range.selectNodeContents(node);
      range.collapse(false);
      const sel = win.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function caretPageContent(win) {
      const sel = win.getSelection();
      const node = sel?.anchorNode?.nodeType === Node.ELEMENT_NODE ? sel.anchorNode : sel?.anchorNode?.parentElement;
      return node?.closest?.(".page-content") || null;
    }

    function tableCells(doc) {
      return Array.from(doc.querySelectorAll('#editor table th, #editor table td'));
    }

    function firstTextNode(root) {
      const walker = root.ownerDocument.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      return walker.nextNode();
    }

    function selectAcrossCells(win, doc, fromIndex, toIndex) {
      const cells = tableCells(doc);
      const start = firstTextNode(cells[fromIndex]);
      const end = firstTextNode(cells[toIndex]);
      if (!start || !end) return '';
      const range = doc.createRange();
      range.setStart(start, Math.min(2, start.length));
      range.setEnd(end, Math.min(5, end.length));
      const sel = win.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      doc.getElementById('editor').dispatchEvent(new win.MouseEvent('mouseup', { bubbles: true }));
      return sel.toString();
    }

    function dispatchTab(win, editor, shiftKey = false) {
      editor.dispatchEvent(new win.KeyboardEvent('keydown', {
        key: 'Tab', shiftKey, bubbles: true, cancelable: true
      }));
    }

    function selectionCell(win) {
      const sel = win.getSelection();
      const node = sel?.anchorNode?.nodeType === Node.ELEMENT_NODE ? sel.anchorNode : sel?.anchorNode?.parentElement;
      return node?.closest?.('th,td') || null;
    }

    async function resetDocument(win, doc) {
      win.art.editor.newDoc();
      await waitFor(() => pageContents(doc).length === 1 && doc.querySelector('#editor .page-content'), 'text document reset');
      await wait(150);
    }

    async function run() {
      // Чекаємо опитуванням, а не на подію 'load': якщо іфрейм завантажився
      // раніше, ніж повісили слухач, подія вже не спрацює й тест зависне
      // назавжди. Заразом це гарантує, що contentDocument — уже документ
      // редактора, а не початковий about:blank.
      await waitFor(() => (
        typeof frame.contentWindow?.TextApp?.boot === 'function' &&
        !!frame.contentWindow?.art?.editor &&
        !!frame.contentDocument?.querySelector('#editor .page-content')
      ), 'Text boot', 20000);

      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      const editor = doc.getElementById('editor');
      const initialPages = pageContents(doc);
      const baseChecks = [
        check('TextApp boot facade is exposed', typeof win.TextApp.boot === 'function'),
        check('editor facade is exposed', !!win.art?.editor?.insertTable),
        check('document has one contenteditable host',
          editor.getAttribute('contenteditable') === 'true'
          && initialPages.length === 1
          && initialPages[0].isContentEditable
          && initialPages.every(page => !page.hasAttribute('contenteditable'))),
        check('standard shell commands are present', ['new', 'open', 'save', 'undo', 'redo'].every(cmd => doc.querySelector(`[data-office-command="${cmd}"]`))),
        check('status counters are present', !!doc.getElementById('statusWords') && !!doc.getElementById('statusChars'))
      ];

      await resetDocument(win, doc);
      let firstPage = pageContents(doc)[0];
      const paragraphs = Array.from({ length: 180 }, (_, index) => {
        return `<p>Paragraph ${index + 1}. This long diagnostic document is used to reproduce current Text pagination behavior across generated pages.</p>`;
      }).join('');
      firstPage.innerHTML = paragraphs;
      setCaretAtEnd(win, firstPage.lastElementChild);
      editor.dispatchEvent(new win.Event('input', { bubbles: true }));
      // Розбиття на сторінки йде кількома проходами, а під --virtual-time-budget
      // віртуальний годинник стрибає — тож чекаємо не лише на другу сторінку,
      // а на стабілізацію їх кількості.
      await waitFor(() => pageContents(doc).length > 1, 'long document pagination', 20000);
      let settled = pageContents(doc).length;
      await waitFor(() => {
        const now = pageContents(doc).length;
        const stable = now === settled;
        settled = now;
        return stable;
      }, 'pagination to settle', 20000);
      await wait(600);

      const longPages = pageContents(doc);
      const longOverflows = longPages.map(isOverflowing);
      const activeNode = win.getSelection()?.anchorNode?.nodeType === Node.ELEMENT_NODE
        ? win.getSelection().anchorNode
        : win.getSelection()?.anchorNode?.parentElement;
      const selectionPageIndex = longPages.indexOf(activeNode?.closest?.('.page-content'));
      const selectionReachedLastPage = selectionPageIndex === longPages.length - 1;

      // Один editing host дозволяє Range і браузерному mouse-selection
      // перетинати візуальну межу двох сторінок. Тут додатково перевіряємо,
      // що пагінація зберігає такий наскрізний Range.
      const startBlock = Array.from(longPages[0].children).reverse().find(node => (node.textContent || '').trim());
      const endBlock = Array.from(longPages[1].children).find(node => (node.textContent || '').trim());
      const startText = startBlock?.firstChild;
      const endText = endBlock?.firstChild;
      if (startText?.nodeType === Node.TEXT_NODE && endText?.nodeType === Node.TEXT_NODE) {
        const crossRange = doc.createRange();
        crossRange.setStart(startText, Math.max(0, startText.textContent.length - 12));
        crossRange.setEnd(endText, Math.min(12, endText.textContent.length));
        const crossSelection = win.getSelection();
        crossSelection.removeAllRanges();
        crossSelection.addRange(crossRange);
        editor.dispatchEvent(new win.Event('input', { bubbles: true }));
        await wait(250);
      }
      const crossPages = pageContents(doc);
      const crossSelection = win.getSelection();
      const crossAnchorNode = crossSelection?.anchorNode?.nodeType === Node.ELEMENT_NODE
        ? crossSelection.anchorNode : crossSelection?.anchorNode?.parentElement;
      const crossFocusNode = crossSelection?.focusNode?.nodeType === Node.ELEMENT_NODE
        ? crossSelection.focusNode : crossSelection?.focusNode?.parentElement;
      const crossPageSelectionWorks = crossPages.indexOf(crossAnchorNode?.closest?.('.page-content')) === 0
        && crossPages.indexOf(crossFocusNode?.closest?.('.page-content')) === 1
        && (crossSelection?.toString() || '').length > 12;

      win.art.toolbar.applyCommand('bold');
      await wait(250);
      const formattedPages = pageContents(doc);
      const crossPageFormattingWorks = !!formattedPages[0]?.querySelector('strong')
        && !!formattedPages[1]?.querySelector('strong');
      const selectionMarkersCleaned = !editor.querySelector('.art-sel-marker');

      // Шапка, меню й панель мають лишатися на місці: скролиться лише область
      // аркушів, а не сама сторінка застосунку.
      const scroller = doc.querySelector(".editor-scroll");
      const chromeStaysFixed = doc.body.scrollHeight <= doc.body.clientHeight + 1 &&
        scroller.scrollHeight > scroller.clientHeight + 1 &&
        Math.round(doc.querySelector(".app-header").getBoundingClientRect().top) === 0;

      // Enter унизу заповненого аркуша має відкривати наступну сторінку,
      // переносити туди карету й дозволяти набирати далі.
      const pagesBeforeEnter = pageContents(doc).length;
      setCaretAtEnd(win, pageContents(doc).slice(-1)[0].lastElementChild);
      for (let i = 0; i < 45; i += 1) {
        editor.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
        await wait(40);
        if (pageContents(doc).length > pagesBeforeEnter) break;
      }
      await wait(500);

      const pagesAfterEnter = pageContents(doc);
      const caretPageIndex = pagesAfterEnter.indexOf(caretPageContent(win));
      // Фокус лишається на єдиному editing host, а Range визначає сторінку.
      const focusOnDocument = doc.activeElement === editor;

      // ── Таблиці ──────────────────────────────────────────────────────────
      await resetDocument(win, doc);
      firstPage = pageContents(doc)[0];
      editor.focus();
      setCaretAtStart(win, firstPage.querySelector('p') || firstPage);
      win.art.editor.insertTable(3, 3);
      await wait(600);

      tableCells(doc).forEach((cell, index) => { cell.textContent = 'Клітинка' + (index + 1); });
      editor.dispatchEvent(new win.Event('input', { bubbles: true }));
      await wait(400);

      // Inline-форматування виділення через дві клітинки не має виносити <th>
      // в inline-обгортку й ламати рядок.
      selectAcrossCells(win, doc, 0, 1);
      win.art.toolbar.applyCommand('italic');
      await wait(400);

      const cellsAfterFormatting = tableCells(doc).length;
      const rowWidths = Array.from(doc.querySelectorAll('#editor table tr')).map(row => row.children.length);
      const structureSurvivedFormatting = cellsAfterFormatting === 9
        && rowWidths.every(width => width === 3)
        && !doc.querySelector('#editor tr > em, #editor em th, #editor em td');
      const italicStayedInsideCells = doc.querySelectorAll('#editor table th em, #editor table td em').length === 2;

      // Tab/Shift+Tab ходять по клітинках, у останній клітинці додається рядок.
      const navCells = tableCells(doc);
      setCaretAtStart(win, navCells[0]);
      dispatchTab(win, editor);
      await wait(150);
      const tabMovedForward = selectionCell(win) === tableCells(doc)[1];
      dispatchTab(win, editor, true);
      await wait(150);
      const shiftTabMovedBack = selectionCell(win) === tableCells(doc)[0];

      const rowsBeforeTab = doc.querySelectorAll('#editor table tr').length;
      setCaretAtStart(win, tableCells(doc).slice(-1)[0]);
      dispatchTab(win, editor);
      await wait(400);
      const tabAddedRow = doc.querySelectorAll('#editor table tr').length === rowsBeforeTab + 1;

      // Компактна кнопка та спільне контекстне меню не додають окремого рядка.
      setCaretAtStart(win, tableCells(doc)[0]);
      editor.dispatchEvent(new win.Event('keyup', { bubbles: true }));
      await wait(100);
      const tableMenuButton = doc.getElementById('tableMenuButton');
      const tableContextMenu = doc.getElementById('tableContextMenu');
      const compactTableButtonVisible = tableMenuButton
        && !doc.getElementById('tableToolbarEntry').hidden
        && !doc.getElementById('tableContextBar');

      tableMenuButton.click();
      await wait(50);
      const tableMenuOpensFromButton = !tableContextMenu.hidden
        && tableMenuButton.getAttribute('aria-expanded') === 'true';
      win.art.editor.hideTableMenu();

      const contextEventHandled = !tableCells(doc)[0].dispatchEvent(new win.MouseEvent('contextmenu', {
        bubbles: true, cancelable: true, clientX: 180, clientY: 220
      }));
      await wait(50);
      const tableMenuOpensFromRightClick = contextEventHandled && !tableContextMenu.hidden;
      win.art.editor.hideTableMenu();

      editor.focus();
      setCaretAtStart(win, tableCells(doc)[0]);
      editor.dispatchEvent(new win.KeyboardEvent('keydown', {
        key: 'F10', shiftKey: true, bubbles: true, cancelable: true
      }));
      await wait(50);
      const tableMenuOpensFromKeyboard = !tableContextMenu.hidden
        && tableContextMenu.contains(doc.activeElement);
      tableContextMenu.dispatchEvent(new win.KeyboardEvent('keydown', {
        key: 'Escape', bubbles: true, cancelable: true
      }));
      const tableMenuEscapeRestoresEditor = tableContextMenu.hidden && doc.activeElement === editor;

      const columnsBeforeAction = doc.querySelector('#editor table tr').children.length;
      setCaretAtStart(win, tableCells(doc)[0]);
      tableMenuButton.click();
      tableContextMenu.querySelector('[data-table-action="column-right"]').click();
      await wait(500);
      const columnAddedEverywhere = Array.from(doc.querySelectorAll('#editor table tr'))
        .every(row => row.children.length === columnsBeforeAction + 1);
      const rowsBeforeDelete = doc.querySelectorAll('#editor table tr').length;
      win.art.editor.tableAction('row-delete');
      await wait(500);
      const rowDeleted = doc.querySelectorAll('#editor table tr').length === rowsBeforeDelete - 1;
      setCaretAtStart(win, tableCells(doc)[0]);
      win.art.editor.tableAction('table-delete');
      await wait(100);
      const tableDeletionNeedsConfirmation = doc.getElementById('modalConfirm').classList.contains('active')
        && !!doc.querySelector('#editor table');
      win.art.modals.confirmNo();

      // ── Велика таблиця ділиться між сторінками ──────────────────────────
      await resetDocument(win, doc);
      editor.focus();
      setCaretAtStart(win, pageContents(doc)[0].querySelector('p') || pageContents(doc)[0]);
      win.art.editor.insertTable(50, 4);
      await waitFor(() => pageContents(doc).length > 1, 'large table pagination', 20000);
      let settledTablePages = pageContents(doc).length;
      await waitFor(() => {
        const now = pageContents(doc).length;
        const stable = now === settledTablePages;
        settledTablePages = now;
        return stable;
      }, 'large table pagination to settle', 20000);
      await wait(500);

      const tablePages = pageContents(doc);
      const dataRowSelector = '#editor table tr:not([data-art-table-repeat])';
      const rows = doc.querySelectorAll(dataRowSelector).length;
      const cells = Array.from(doc.querySelectorAll(dataRowSelector + ' > th, ' + dataRowSelector + ' > td'));
      const tableOverflows = tablePages.some(isOverflowing);
      const clippedRows = Array.from(doc.querySelectorAll('#editor table tr')).filter(row => {
        const page = row.closest('.page-content');
        return page && row.getBoundingClientRect().bottom > page.getBoundingClientRect().bottom + 1;
      }).length;
      const repeatedHeaders = doc.querySelectorAll('#editor tr[data-art-table-repeat]').length;
      const firstPageHasContent = !!tablePages[0].querySelector('table, img') || (tablePages[0].textContent || '').trim().length > 0;

      // Повторений заголовок — лише представлення: він не редагується, а Tab
      // переводить карету до справжнього рядка без додавання зайвих рядків.
      const repeatedHeaderCell = doc.querySelector('#editor tr[data-art-table-repeat] > th');
      const repeatedHeaderReadOnly = !!repeatedHeaderCell
        && repeatedHeaderCell.closest('tr').getAttribute('contenteditable') === 'false';
      const rowsBeforeRepeatedHeaderTab = doc.querySelectorAll(dataRowSelector).length;
      if (repeatedHeaderCell) {
        setCaretAtStart(win, repeatedHeaderCell);
        dispatchTab(win, editor);
        await wait(150);
      }
      const repeatedHeaderTabSafe = doc.querySelectorAll(dataRowSelector).length === rowsBeforeRepeatedHeaderTab
        && !selectionCell(win)?.closest('tr')?.hasAttribute('data-art-table-repeat');

      const exportBox = doc.createElement('div');
      exportBox.innerHTML = win.art.editor.getExportHTML();
      const exportTables = exportBox.querySelectorAll('table').length;
      const exportRows = exportBox.querySelectorAll('tr').length;
      const exportKeepsHeaderOnce = exportBox.querySelectorAll('th').length === 4;

      // ── DOCX round-trip таблиці ─────────────────────────────────────────
      const docxSource = '<p>До таблиці</p><table><tbody>'
        + '<tr><th>Заголовок A</th><th>Заголовок B</th></tr>'
        + '<tr><td>Рядок<br>другий рядок</td><td><strong>Жирне</strong></td></tr>'
        + '</tbody></table><p>Після таблиці</p>';
      let docxRoundTrip = { tables: 0, rows: 0, cells: 0, headerCells: 0, dataCells: 0, lineBreak: false, bold: false, error: null };
      try {
        const blob = await win.art.formats.docx.exportDocx(docxSource, {});
        const file = new win.File([blob], 'smoke.docx', {
          type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        });
        const restored = await win.art.formats.docx.importDocx(file);
        const box = doc.createElement('div');
        box.innerHTML = restored.html;
        const restoredCells = Array.from(box.querySelectorAll('td, th'));
        docxRoundTrip = {
          tables: box.querySelectorAll('table').length,
          rows: box.querySelectorAll('tr').length,
          cells: restoredCells.length,
          headerCells: box.querySelectorAll('th').length,
          dataCells: box.querySelectorAll('td').length,
          lineBreak: !!restoredCells[2] && restoredCells[2].querySelectorAll('br').length > 0,
          bold: box.querySelectorAll('strong, b').length > 0,
          error: null
        };
      } catch (err) {
        docxRoundTrip.error = err && err.message ? err.message : String(err);
      }
      const docxTableRoundTripWorks = docxRoundTrip.tables === 1
        && docxRoundTrip.rows === 2
        && docxRoundTrip.cells === 4
        && docxRoundTrip.headerCells === 2
        && docxRoundTrip.dataCells === 2
        && docxRoundTrip.lineBreak
        && docxRoundTrip.bold;

      // Геометрія має потрапляти до секції DOCX. Перехоплюємо лише фінальний
      // Document/Packer, а реальні Paragraph/Table класи лишаємо без змін.
      let capturedDocxOptions = null;
      const RealDocument = win.docx.Document;
      const realToBlob = win.docx.Packer.toBlob;
      try {
        win.docx.Document = class {
          constructor(options) { capturedDocxOptions = options; }
        };
        win.docx.Packer.toBlob = async () => new win.Blob(['test']);
        await win.art.formats.docx.exportDocx('<p>Геометрія</p>', {
          pageSize: 'a5',
          orientation: 'landscape',
          margins: { top: 1, right: 2, bottom: 3, left: 4 }
        });
      } finally {
        win.docx.Document = RealDocument;
        win.docx.Packer.toBlob = realToBlob;
      }
      const exportedPage = capturedDocxOptions?.sections?.[0]?.properties?.page;
      const docxKeepsPageGeometry = exportedPage?.size?.width === 11906
        && exportedPage?.size?.height === 8391
        && exportedPage?.margin?.top === 567
        && exportedPage?.margin?.right === 1134
        && exportedPage?.margin?.bottom === 1701
        && exportedPage?.margin?.left === 2268;

      // Rowspan, що перетинає межу сторінки, не можна рознести по двох
      // незалежних таблицях. Така таблиця має лишитися цілою і видимою.
      await resetDocument(win, doc);
      firstPage = pageContents(doc)[0];
      const mergedRows = ['<tr><th>Клас</th><th>Учень</th></tr>'];
      mergedRows.push('<tr><td rowspan="40">7-А</td><td>Учень 1</td></tr>');
      for (let index = 2; index <= 40; index += 1) mergedRows.push(`<tr><td>Учень ${index}</td></tr>`);
      for (let index = 41; index <= 50; index += 1) mergedRows.push(`<tr><td>7-Б</td><td>Учень ${index}</td></tr>`);
      firstPage.innerHTML = `<table><tbody>${mergedRows.join('')}</tbody></table>`;
      editor.dispatchEvent(new win.Event('input', { bubbles: true }));
      await waitFor(() => !!doc.querySelector('#editor .page[data-art-oversize]'), 'rowspan table overflow fallback', 20000);
      await wait(300);
      const mergedTable = doc.querySelector('#editor table');
      const rowspanTableStaysWhole = doc.querySelectorAll('#editor table').length === 1
        && !doc.querySelector('#editor table[data-art-table-part]')
        && mergedTable?.querySelector('[rowspan="40"]')?.rowSpan === 40
        && !isOverflowing(mergedTable?.closest('.page-content'));
      const mergedColumnCount = mergedTable?.rows?.[0]?.cells?.length || 0;
      setCaretAtStart(win, mergedTable.querySelector('td[rowspan]'));
      editor.dispatchEvent(new win.Event('keyup', { bubbles: true }));
      await wait(100);
      // Раніше будь-яка дія над таблицею з об'єднаннями була заблокована.
      // Тепер координатна сітка дозволяє їх виконувати коректно: колонка
      // додається всім рядкам, а висока об'єднана клітинка не втрачає rowspan
      // і не «розмножується» у кожен рядок.
      const rowsWithTwoCellsBefore =
        Array.from(mergedTable.rows).filter(row => row.cells.length === 2).length;

        check('table survives formatting across two cells', structureSurvivedFormatting),
        check('formatting lands inside the cells', italicStayedInsideCells),
        check('Tab moves to the next cell', tabMovedForward),
        check('Shift+Tab moves to the previous cell', shiftTabMovedBack),
        check('Tab in the last cell adds a row', tabAddedRow),
        check('table controls use a compact toolbar button without a separate row', compactTableButtonVisible),
        check('table menu opens from the compact button', tableMenuOpensFromButton),
        check('table menu opens on right click', tableMenuOpensFromRightClick),
        check('Shift+F10 opens the table menu', tableMenuOpensFromKeyboard),
        check('Escape closes the table menu and restores editor focus', tableMenuEscapeRestoresEditor),
        check('vertical merge spans one column only', verticalMerge),
        check('horizontal merge spans one row only', horizontalMerge),
        check('block merge spans a rectangle', blockMerge),
        check('merge keeps the content of every cell', mergeKeepsContent),
        check('split restores the original grid with data-row tags', splitRestoresGrid),
        check('inserting a column respects a spanning header', columnInsertRespectsSpan),
        check('deleting a row shrinks a rowspan instead of losing it', rowDeleteShrinksSpan),
        check('deleting a column narrows a colspan instead of losing it', columnDeleteNarrowsSpan),
        check('split stays disabled for a plain cell', splitDisabledForPlainCell),
        check('merged cells survive .docx export as gridSpan/vMerge', mergedTableExports),
        check('find matches only the exact word form', findFoundExactForms),
        check('replace one changes a single match', replaceOneReplacedSingle),
        check('replace all changes the rest', replaceAllReplacedRest),
        check('replace leaves no search highlights behind', replaceLeavesNoHighlights),
        check('replace is undoable as one step', replaceIsUndoable),
        check('replacing with an empty string deletes the match', replaceWithEmptyDeletes),
        check('a query with no matches is reported', missingQueryReported),
        check('line spacing applies to every selected paragraph', lineHeightAppliesToSelection),
        check('line spacing is reported back for the selection', lineHeightReported),
        check('line spacing can be cleared', lineHeightClears),
        check('line spacing changes how much fits on a page', lineHeightChangesPageCapacity),
        check('default line spacing matches the toolbar scale', defaultSpacingIsOnTheScale),
        check('page numbers off show nothing', numbersOffShowNothing),
        check('page numbers on are sequential', numbersOnAreSequential),
        check('skipping the first page leaves the title blank', skipFirstLeavesTitleBlank),
        check('page number position reaches the layout', positionReachesLayout),
        check('page numbers belong to the document snapshot', pageNumbersInDocumentSnapshot),
        check('invalid page number settings are normalized', pageNumbersNormalized),
        check('status bar shows the page count', statusShowsPageCount),
        check('column action applies to every row', columnAddedEverywhere),
        check('row action removes a row', rowDeleted),
        check('deleting a table requires confirmation', tableDeletionNeedsConfirmation),
        check('large table splits across pages', tablePages.length > 1),
        check('large table keeps all requested rows', rows === 50),
        check('large table exposes editable cells', cells.length === 200),
        check('large table leaves no clipped rows', clippedRows === 0 && !tableOverflows),
        check('table continuation repeats the header row', repeatedHeaders === tablePages.length - 1),
        check('repeated table headers are read-only', repeatedHeaderReadOnly),
        check('Tab on a repeated header does not add a row', repeatedHeaderTabSafe),
        check('table does not push a blank page in front of itself', firstPageHasContent),
        check('export merges the split table back', exportTables === 1 && exportRows === 50 && exportKeepsHeaderOnce),
        check('docx round-trip keeps table structure and line breaks', docxTableRoundTripWorks),
        check('docx export keeps page size, orientation and margins', docxKeepsPageGeometry),
        check('rowspan table stays structurally whole and visible', rowspanTableStaysWhole),
        check('row and column actions work on a table with merged cells', mergedActionsWorkOnGrid),
        check('a single tall table row remains visible', tallRowVisible),
        check('page starts with A4 geometry and school margins', defaultGeometryOk),
        check('ruler aligns with the page', rulerAligned),
        check('ruler reports the current left margin', rulerReportsMargin),
        check('ruler handle responds to the keyboard', rulerKeyboardWorks),
        check('page setup dialog opens with current values', setupDialogOpens),
        check('page setup dialog keeps every control inside the modal', setupDialogFitsBox),
        check('margins accept a comma as the decimal separator', commaMarginAccepted),
        check('page setup applies paper size, orientation and margins', setupAppliesGeometry),
        check('page setup marks the document as changed', pageSetupMarksDocumentDirty),
        check('Undo restores page geometry and saved state', pageSetupUndoWorks),
        check('Redo restores changed page geometry', pageSetupRedoWorks),
        check('margins change how much fits on a page', marginsChangePageCapacity),
        check('new document restores default page geometry', newDocumentResetsGeometry)
      ];

      const failed = checks.filter(item => !item.ok);
      const diagnostics = [
        '',
        'Diagnostics:',
        `long page count: ${longPages.length}`,
        `overflowing long pages: ${longOverflows.map((value, index) => value ? index + 1 : null).filter(Boolean).join(', ') || 'none'}`,
        `selection page after pagination: ${selectionPageIndex + 1 || 'unknown'}`,
        `selection reached last page: ${selectionReachedLastPage}`,
        `selection spans adjacent pages: ${crossPageSelectionWorks}`,
        `formatting spans adjacent pages: ${crossPageFormattingWorks}`,
        `selection markers cleaned: ${selectionMarkersCleaned}`,
        `table page count: ${tablePages.length}`,
        `table data rows: ${rows}`,
        `table clipped rows: ${clippedRows}`,
        `repeated header rows: ${repeatedHeaders}`,
        `export tables/rows: ${exportTables}/${exportRows}`,
        `docx round-trip: ${JSON.stringify(docxRoundTrip)}`,
        `tall row: ${JSON.stringify(tallRowDiagnostics)}`,
        `page setup undo: ${JSON.stringify(pageSetupUndoState)}`,
        `pages before/after Enter: ${pagesBeforeEnter}/${pagesAfterEnter.length}`,
        `caret page after Enter: ${caretPageIndex + 1 || 'unknown'}`,
        `chrome stays fixed: ${chromeStaysFixed}`,
        `focus on document host: ${focusOnDocument}`,
        `page geometry: ${JSON.stringify(defaultGeometry)}`,
        `applied geometry: ${JSON.stringify(appliedGeometry)}`,
        `page setup controls outside the modal: ${setupOverflow.length}`,
        `comma margin accepted: ${commaMarginAccepted}`,
        `paragraphs on first page with normal/wide margins: ${paragraphsWithNormalMargins}/${settledWideParagraphs}`,
        `ruler: ${JSON.stringify(rulerDiagnostics)}`
      ];

      result.textContent = checks
        .map(item => `${item.ok ? 'PASS' : 'FAIL'} ${item.label}`)
        .concat(diagnostics)
        .concat(failed.length ? [`FAILED: ${failed.map(item => item.label).join('; ')}`] : ['PASSED'])
        .join('\n');

      if (failed.length) {
        document.body.dataset.textBehavior = 'failed';
        throw new Error(failed.map(item => item.label).join('; '));
      }

      document.body.dataset.textBehavior = 'passed';
    }

    run().catch(err => {
      document.body.dataset.textBehavior = 'failed';
      // Лишаємо список перевірок і діагностику: інакше причину падіння видно
      // тільки під час ручного відтворення.
      const previous = result.textContent === 'Running...' ? '' : result.textContent + String.fromCharCode(10, 10);
      result.textContent = previous + (err?.stack || err?.message || String(err));
    });
  </script>
</body>
</html>
