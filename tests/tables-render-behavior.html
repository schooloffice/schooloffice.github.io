<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tables Render Behavior</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #162033; }
    iframe { width: 960px; height: 540px; border: 1px solid #d6dce5; border-radius: 8px; }
    pre { white-space: pre-wrap; padding: 16px; border: 1px solid #d6dce5; border-radius: 8px; background: #f8fafc; }
    .pass { color: #15803d; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Tables Render Behavior</h1>
  <pre id="result">Running...</pre>
  <iframe id="tablesFrame" src="../tables/"></iframe>

  <script>
    const result = document.getElementById('result');
    const frame = document.getElementById('tablesFrame');

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function run() {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('tables iframe load timed out')), 7000);
        frame.addEventListener('load', () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });

      await wait(500);

      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      await win.TablesApp?.ready;
      const headers = doc.querySelectorAll('#headRow th.col-header');
      const rows = doc.querySelectorAll('#bodyRows tr');
      const cells = doc.querySelectorAll('#bodyRows td[data-id]');
      const activeCellRef = doc.getElementById('activeCellRef');
      const activeCell = (activeCellRef?.value || activeCellRef?.textContent || '').trim();
      win.TablesViewOptions.setZoom(100);
      const defaultCellHeight = Math.round(doc.querySelector('#bodyRows td[data-id]')?.getBoundingClientRect().height || 0);
      const defaultHeaderHeight = Math.round(doc.querySelector('#headRow th')?.getBoundingClientRect().height || 0);
      const defaultCellFont = win.getComputedStyle(doc.querySelector('.cell-input')).fontSize;
      const workspaceStyle = win.getComputedStyle(doc.querySelector('.workspace'));
      const sheetShellStyle = win.getComputedStyle(doc.querySelector('.sheet-shell'));
      const menuLayer = Number.parseInt(win.getComputedStyle(doc.querySelector('.menubar')).zIndex, 10);
      const toolbarLayer = Number.parseInt(win.getComputedStyle(doc.querySelector('.toolbar')).zIndex, 10);
      const gridHeaderLayer = Number.parseInt(win.getComputedStyle(doc.querySelector('.row-header')).zIndex, 10);

      const checks = [
        ['TablesApp boot exported', typeof win.TablesApp?.boot === 'function'],
        ['default columns rendered', headers.length >= 30],
        ['default rows rendered', rows.length >= 60],
        ['default cells rendered', cells.length >= 1800],
        ['active cell visible', activeCell === 'A1'],
        ['default grid uses compact 30px rows', defaultCellHeight === 30],
        ['default grid uses compact 32px headers', defaultHeaderHeight === 32],
        ['compact grid keeps readable 15px cell text', defaultCellFont === '15px'],
        ['workspace has no decorative inset', workspaceStyle.padding === '0px'],
        ['sheet fills workspace without card styling', sheetShellStyle.margin === '0px' && sheetShellStyle.borderRadius === '0px' && sheetShellStyle.boxShadow === 'none'],
        ['main menu layer stays above grid headers', menuLayer > gridHeaderLayer],
        ['toolbar popovers layer stays above grid headers', toolbarLayer > gridHeaderLayer]
      ];

      // ---- Autofill drag wiring (end-to-end через реальний grid) ----
      const fire = (el, type, opts) =>
        el.dispatchEvent(new win.MouseEvent(type, Object.assign({ bubbles: true, button: 0 }, opts)));
      const setCell = (id, val) => {
        const inp = doc.getElementById('inp_' + id);
        inp.value = val;
        inp.dispatchEvent(new win.Event('input', { bubbles: true }));
      };

      setCell('A1', '1');
      setCell('A2', '2');

      // Виділити A1:A2
      fire(doc.querySelector('td[data-id="A1"]'), 'mousedown');
      fire(doc.querySelector('td[data-id="A2"]'), 'mouseenter');
      fire(doc, 'mouseup');

      const handle = doc.querySelector('.fill-handle');
      const handleVisible = !!handle && handle.style.display === 'block';

      // Перетягнути маркер до A5
      if (handle) {
        fire(handle, 'mousedown');
        fire(doc.querySelector('td[data-id="A5"]'), 'mouseenter');
        fire(doc, 'mouseup');
      }
      await wait(50);

      checks.push(['fill handle appears for selection', handleVisible]);
      checks.push(['autofill drag fills A3', doc.getElementById('inp_A3')?.value === '3']);
      checks.push(['autofill drag fills A4', doc.getElementById('inp_A4')?.value === '4']);
      checks.push(['autofill drag fills A5', doc.getElementById('inp_A5')?.value === '5']);

      // ---- Вирівнювання за типом даних (Хвиля 1.4) ----
      setCell('F1', '42');
      setCell('G1', 'привіт');
      win.TablesCalculation.recalculateAll();
      const tdF1 = doc.querySelector('td[data-id="F1"]');
      const tdG1 = doc.querySelector('td[data-id="G1"]');
      const alignOf = id => win.getComputedStyle(doc.getElementById('inp_' + id)).textAlign;
      checks.push(['number cell typed', tdF1.classList.contains('cell-type-number')]);
      checks.push(['text cell typed', tdG1.classList.contains('cell-type-text')]);
      checks.push(['number aligns right by default', alignOf('F1') === 'right']);
      checks.push(['text aligns left by default', alignOf('G1') === 'left']);
      tdF1.classList.add('style-align-left');
      checks.push(['explicit align overrides type', alignOf('F1') === 'left']);

      // ---- Умовне форматування (Хвиля 2.2) ----
      const CF = win.TablesConditionalFormatting;
      checks.push(['cond matches helper (lt)', CF.condRuleMatches({ op: 'lt', v1: 4 }, 2) === true]);
      checks.push(['cond rejects helper (lt)', CF.condRuleMatches({ op: 'lt', v1: 4 }, 9) === false]);
      checks.push(['cond between helper', CF.condRuleMatches({ op: 'between', v1: 4, v2: 6 }, 5) === true]);

      setCell('H1', '2');
      setCell('H2', '9');
      CF.addRule({ range: [7, 1, 7, 2], op: 'lt', v1: 4, v2: null, fill: '#fee2e2' });
      win.TablesCalculation.recalculateAll();
      const bgOf = id => win.getComputedStyle(doc.querySelector('td[data-id="' + id + '"]')).backgroundColor;
      checks.push(['cond fill applies to H1 (<4)', bgOf('H1') === 'rgb(254, 226, 226)']);
      checks.push(['cond fill skips H2 (>=4)', bgOf('H2') !== 'rgb(254, 226, 226)']);
      CF.clearCondRules();

      // Повний UI-потік: вибір клітинки → модалка → кнопка «Додати правило»
      fire(doc.querySelector('td[data-id="H3"]'), 'mousedown');
      fire(doc, 'mouseup');
      setCell('H3', '1');
      CF.openCondFormatModal();
      doc.getElementById('condOp').value = 'lt';
      doc.getElementById('condV1').value = '4';
      doc.getElementById('condAddBtn').click();
      win.TablesCalculation.recalculateAll();
      checks.push(['cond modal add-button applies', bgOf('H3') === 'rgb(254, 226, 226)']);
      checks.push(['cond rule listed', !!doc.querySelector('#condRuleList .cond-rule-item')]);
      CF.clearCondRules();

      // ---- Фільтр за стовпцем (Хвиля 2.3) ----
      const FL = win.TablesFilter;
      checks.push(['filter matches gt', FL.filterMatches({ op: 'gt', v1: 5 }, '10') === true]);
      checks.push(['filter contains text', FL.filterMatches({ op: 'contains', v1: 'ан' }, 'Іванов') === true]);
      checks.push(['filter excludes empty', FL.filterMatches({ op: 'gt', v1: 0 }, '') === false]);

      setCell('J1', '3'); setCell('J2', '8'); setCell('J3', '1'); setCell('J4', '=4+5');
      fire(doc.querySelector('td[data-id="J1"]'), 'mousedown');
      fire(doc, 'mouseup');
      FL.openFilterModal();
      doc.getElementById('filterOp').value = 'ge';
      doc.getElementById('filterV1').value = '5';
      doc.getElementById('filterApplyBtn').click();
      const trDisplay = id => doc.querySelector('td[data-id="' + id + '"]').closest('tr').style.display;
      checks.push(['filter hides J1 (3<5)', trDisplay('J1') === 'none']);
      checks.push(['filter shows J2 (8>=5)', trDisplay('J2') === '']);
      checks.push(['filter hides J3 (1<5)', trDisplay('J3') === 'none']);
      checks.push(['filter matches formula result J4 (=9)', trDisplay('J4') === '']);
      FL.clearRowFilter();
      checks.push(['clear filter shows J1 again', trDisplay('J1') === '']);

      // Структурне видалення рядка → #REF! у залежній формулі (end-to-end)
      setCell('K1', '7');
      setCell('K5', '=K1');
      win.TablesStructure.deleteRow(1);
      checks.push(['delete row yields #REF! in dependent formula', doc.getElementById('inp_K4')?.value === '#REF!']);

      // Умовне форматування рухається разом зі структурою аркуша
      win.TablesConditionalFormatting.clearCondRules();
      setCell('L2', '1');
      win.TablesConditionalFormatting.addRule({ range: [11, 2, 11, 2], op: 'lt', v1: 5, v2: null, fill: '#fee2e2' });
      win.TablesStructure.insertRow(1);
      checks.push(['conditional rule shifts with inserted row', doc.querySelector('td[data-id="L3"]')?.style.backgroundColor !== '']);

      // ---- Кілька аркушів (Хвиля 3.1) ----
      const SH = win.TablesSheets;
      const tabCount = () => doc.querySelectorAll('#sheetTabs .sheet-tab').length;
      const inpVal = id => doc.getElementById('inp_' + id)?.value;

      checks.push(['one sheet initially', tabCount() === 1]);
      const sheet1A1 = inpVal('A1');

      SH.addSheet();
      checks.push(['second sheet added', tabCount() === 2]);
      checks.push(['new sheet has empty A1', inpVal('A1') === '']);

      setCell('A1', 'S2');
      SH.switchToSheet(0);
      checks.push(['sheet1 keeps its A1 after switch', inpVal('A1') === sheet1A1]);
      SH.switchToSheet(1);
      checks.push(['sheet2 retains its own A1', inpVal('A1') === 'S2']);

      SH.renameSheet(1, 'Журнал');
      checks.push(['sheet renamed', doc.querySelectorAll('#sheetTabs .sheet-tab')[1].textContent === 'Журнал']);

      SH.switchToSheet(0);
      setCell('B1', '=Журнал!A1');
      SH.switchToSheet(1);
      SH.deleteSheet(1);
      doc.getElementById('confirmBtnYes').click();
      checks.push(['sheet deleted via confirm', tabCount() === 1]);
      checks.push(['deleted sheet references become #REF!', inpVal('B1') === '#REF!']);

      // ---- Безпечний workbook import ----
      const WF = win.TablesWorkbookFile;
      const validPayload = WF.validateWorkbookPayload({
        type: 'art-tables-workbook',
        version: 2,
        name: 'Перевірка',
        activeSheet: 0,
        sheets: [{
          name: 'Аркуш1',
          rows: 60,
          cols: 30,
          cellData: { A1: '10' },
          cellStyles: { A1: 'style-text-bold style-bg-yellow' },
          colWidths: { 0: 90 },
          condRules: [{ range: [0, 1, 0, 10], op: 'gt', v1: 5, v2: null, fill: '#fee2e2' }]
        }]
      });
      checks.push(['workbook validator accepts valid v2', validPayload.sheets[0].cellData.A1 === '10']);
      const validatorRejects = payload => {
        try { WF.validateWorkbookPayload(payload); return false; } catch (_) { return true; }
      };
      checks.push(['workbook validator rejects future version', validatorRejects({ type: 'art-tables-workbook', version: 99, cellData: {} })]);
      checks.push(['workbook validator rejects duplicate sheet names', validatorRejects({
        sheets: [{ name: 'Один' }, { name: 'один' }]
      })]);
      checks.push(['workbook validator rejects out-of-range cell', validatorRejects({
        sheets: [{ name: 'Аркуш1', rows: 10, cols: 10, cellData: { A11: 'x' } }]
      })]);
      checks.push(['workbook validator rejects unknown style', validatorRejects({
        sheets: [{ name: 'Аркуш1', cellStyles: { A1: 'style-unknown' } }]
      })]);
      checks.push(['workbook validator rejects malformed cond rule', validatorRejects({
        sheets: [{ name: 'Аркуш1', condRules: [{ op: 'gt', v1: 1, fill: '#fee2e2' }] }]
      })]);

      // ---- B4: фінансова формула в реальній сітці — введення, undo/redo ----
      const commitCell = (id, val) => {
        setCell(id, val);
        doc.getElementById('inp_' + id).dispatchEvent(new win.Event('blur'));
      };
      const cellText = id => doc.getElementById('inp_' + id)?.value || '';
      commitCell('N1', '0.05');
      commitCell('N2', '36');
      commitCell('N3', '10000');
      commitCell('N4', '=PMT(N1/12,N2,N3)');
      await wait(50);
      const pmtShown = cellText('N4');
      win.undo();
      await wait(50);
      const pmtUndone = cellText('N4');
      win.redo();
      await wait(50);
      const pmtRedone = cellText('N4');
      checks.push(['PMT formula shows the Excel payment in the grid', /^-299[.,]7/.test(pmtShown)]);
      checks.push(['undo removes the PMT formula', pmtUndone === '' && cellText('N3') !== '']);
      checks.push(['redo restores the PMT result', /^-299[.,]7/.test(pmtRedone)]);

      // ---- Формат клітинок: числа, відсотки, дати, дроби, наукові, текст ----
      const NF = win.TablesNumberFormat;
      const CFU = win.TablesCellFormatUi;
      const NB = ' ';
      const nfShow = (token, value) => NF.format(NF.parseToken(token), value);
      const serial2026 = win.ymdToSerial(2026, 11, 25);
      checks.push(['number format module exposed', !!NF && typeof NF.format === 'function' && !!CFU?.openCellFormatDialog]);
      checks.push(['number format 1234.5 → "1 234,50"', nfShow('style-nf-num-2-t', 1234.5) === `1${NB}234,50`]);
      checks.push(['number format without thousands keeps digits together', nfShow('style-nf-num-2', 1234.5) === '1234,50' && nfShow('style-nf-num-0', 2.5) === '3']);
      checks.push(['currency has the symbol after the value', nfShow('style-nf-cur-2-uah', 1234.5) === `1${NB}234,50${NB}₴` && nfShow('style-nf-cur-0-usd', -5) === `-5${NB}$` && nfShow('style-nf-cur-2-eur', 0.5) === `0,50${NB}€`]);
      checks.push(['percent 0.256 → "25,6 %"', nfShow('style-nf-pct-1', 0.256) === `25,6${NB}%` && nfShow('style-nf-pct-0', 0.07) === `7${NB}%`]);
      checks.push(['date serial → "25.11.2026"', nfShow('style-nf-date-dmy', serial2026) === '25.11.2026']);
      checks.push(['date with Ukrainian month names', nfShow('style-nf-date-dmmmy', serial2026) === '25 лис 2026' && nfShow('style-nf-date-dmmmmy', serial2026) === '25 листопада 2026']);
      checks.push(['time and date-time formats', nfShow('style-nf-time-hm', 0.75) === '18:00' && nfShow('style-nf-time-hms', 0.75 + 30 / 86400) === '18:00:30' && nfShow('style-nf-date-dmyhm', serial2026 + 0.5) === '25.11.2026 12:00']);
      checks.push(['fraction 1.5 → "1 1/2" and 0.25 → "1/4"', nfShow('style-nf-frac-1', 1.5) === '1 1/2' && nfShow('style-nf-frac-1', 0.25) === '1/4' && nfShow('style-nf-frac-2', 0.333) === '1/3']);
      checks.push(['scientific 12345 → "1,23E+04"', nfShow('style-nf-sci-2', 12345) === '1,23E+04' && nfShow('style-nf-sci-2', 0.00012) === '1,20E-04']);
      checks.push(['text format keeps "007" as typed', nfShow('style-nf-text', '007') === '007']);
      checks.push(['non-numeric text and errors are shown unchanged', nfShow('style-nf-num-2-t', 'привіт') === 'привіт' && nfShow('style-nf-pct-0', '#DIV/0!') === '#DIV/0!']);
      checks.push(['comma decimal input is understood', nfShow('style-nf-num-2', '12,5') === '12,50']);
      checks.push(['format token validation', NF.isToken('style-nf-num-2-t') && !NF.isToken('style-nf-num-11') && !NF.isToken('style-nf-num-02') && !NF.isToken('style-nf-cur-2-gbp') && !NF.isToken('style-nf-evil')]);

      const selectCell = id => { fire(doc.querySelector('td[data-id="' + id + '"]'), 'mousedown'); fire(doc, 'mouseup'); };
      const selectRange = (from, to) => {
        fire(doc.querySelector('td[data-id="' + from + '"]'), 'mousedown');
        fire(doc.querySelector('td[data-id="' + to + '"]'), 'mouseenter');
        fire(doc, 'mouseup');
      };
      const shown = id => doc.getElementById('inp_' + id)?.value;
      // Збережена модель активного аркуша (глобали `let` недоступні через window).
      const model = () => { const state = win.snapshotState(); return JSON.parse(state.sheets)[state.activeSheet]; };
      const plain = text => String(text ?? '').replace(/[\s ]/g, ' ');
      commitCell('P1', '1234.5');
      commitCell('P2', '0.256');
      commitCell('P3', String(serial2026));
      commitCell('P4', '1.5');
      commitCell('P5', '12345');
      commitCell('P6', '007');
      commitCell('P7', '=P1*2');
      selectCell('P1'); CFU.applyNumberFormatToken('style-nf-num-2-t');
      selectCell('P2'); CFU.applyNumberFormatToken('style-nf-pct-1');
      selectCell('P3'); CFU.applyNumberFormatToken('style-nf-date-dmy');
      selectCell('P4'); CFU.applyNumberFormatToken('style-nf-frac-1');
      selectCell('P5'); CFU.applyNumberFormatToken('style-nf-sci-2');
      selectCell('P6'); CFU.applyNumberFormatToken('style-nf-text');
      await wait(50);
      checks.push(['grid shows 1234.5 as "1 234,50"', shown('P1') === `1${NB}234,50`]);
      checks.push(['grid shows 0.256 as "25,6 %"', shown('P2') === `25,6${NB}%`]);
      checks.push(['grid shows a date serial as "25.11.2026"', shown('P3') === '25.11.2026']);
      checks.push(['grid shows fraction and scientific formats', shown('P4') === '1 1/2' && shown('P5') === '1,23E+04']);
      checks.push(['grid keeps leading zeros in the text format', shown('P6') === '007' && model().cellData.P6 === '007' && doc.querySelector('td[data-id="P6"]').classList.contains('cell-type-text')]);
      checks.push(['formatting does not change stored values', model().cellData.P1 === '1234.5' && model().cellData.P2 === '0.256' && model().cellData.P3 === String(serial2026)]);
      checks.push(['formula on a formatted cell uses the stored number', shown('P7') === '2469']);
      selectCell('P7'); CFU.applyNumberFormatToken('style-nf-num-2-t');
      checks.push(['formula result takes its own cell format', shown('P7') === `2${NB}469,00` && model().cellData.P7 === '=P1*2']);
      commitCell('P1', '1000');
      checks.push(['formatted formula recomputes after the source changes', shown('P7') === `2${NB}000,00`]);

      // Один крок історії на все виділення; Ctrl+Z повертає попередній показ.
      selectRange('P1', 'P2'); CFU.applyNumberFormatToken('style-nf-num-0');
      checks.push(['format applies to the whole selection', shown('P1') === '1000' && shown('P2') === '0']);
      win.undo(); await wait(50);
      checks.push(['one undo reverts the format of the whole selection', shown('P1') === `1${NB}000,00` && shown('P2') === `25,6${NB}%`]);
      win.redo(); await wait(50);
      checks.push(['redo restores the selection format', shown('P1') === '1000' && shown('P2') === '0']);
      selectCell('P2'); CFU.applyNumberFormatToken('');
      checks.push(['General format shows the stored value', shown('P2') === '0.256' && !(model().cellStyles.P2 || '').includes('style-nf-')]);

      // Діалог «Формат клітинок…»: Формат-меню, контекстне меню, Ctrl+1, зразок і застосування.
      checks.push(['Format menu and context menu offer the dialog', !!doc.querySelector('.menu-dropdown[data-menu="format"] [data-action="cell-format"]')
        && !!doc.querySelector('#cellContextMenu [data-context-action="cell-format"]')]);
      selectRange('P1', 'P2');
      const cfModal = doc.getElementById('cellFormatModal');
      win.dispatchUiAction('cell-format');
      const cfCategory = doc.getElementById('cellFormatCategory');
      checks.push(['dialog opens with the active cell format', cfModal.classList.contains('active') && cfModal.getAttribute('aria-hidden') === 'false' && cfCategory.value === 'number'
        && doc.getElementById('cellFormatTarget').textContent === 'P1:P2']);
      checks.push(['dialog preview uses the active cell value', doc.getElementById('cellFormatPreview').textContent === '1000']);
      cfCategory.value = 'percent';
      cfCategory.dispatchEvent(new win.Event('change', { bubbles: true }));
      doc.getElementById('cellFormatDecimals').value = '2';
      doc.getElementById('cellFormatDecimals').dispatchEvent(new win.Event('input', { bubbles: true }));
      checks.push(['dialog preview updates live and shows only relevant options', doc.getElementById('cellFormatPreview').textContent === `100000,00${NB}%`
        && !doc.querySelector('[data-cf-row="decimals"]').hidden && doc.querySelector('[data-cf-row="currency"]').hidden && doc.querySelector('[data-cf-row="date"]').hidden]);
      doc.getElementById('cellFormatApply').click();
      checks.push(['dialog applies the format to the selection and closes', !cfModal.classList.contains('active') && shown('P1') === `100000,00${NB}%` && shown('P2') === `25,60${NB}%`]);
      win.undo(); await wait(50);
      checks.push(['dialog change is one undo step', shown('P1') === '1000' && shown('P2') === '0.256']);
      selectCell('P3');
      doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: '1', code: 'Digit1', ctrlKey: true, bubbles: true, cancelable: true }));
      checks.push(['Ctrl+1 opens the dialog on the date category', cfModal.classList.contains('active') && cfCategory.value === 'date'
        && doc.getElementById('cellFormatPreview').textContent === '25.11.2026']);
      doc.getElementById('cellFormatDate').value = 'dmmmmy';
      doc.getElementById('cellFormatDate').dispatchEvent(new win.Event('change', { bubbles: true }));
      doc.getElementById('cellFormatApply').click();
      checks.push(['dialog date pattern applies', shown('P3') === '25 листопада 2026']);
      const numberSelect = doc.getElementById('numberFormatSelect');
      checks.push(['toolbar select follows the active cell format', numberSelect.value === '__custom']);
      selectCell('P1');
      checks.push(['toolbar select shows a preset format', numberSelect.value === 'style-nf-num-0']);
      numberSelect.value = 'style-nf-cur-2-uah';
      numberSelect.dispatchEvent(new win.Event('change', { bubbles: true }));
      checks.push(['toolbar select applies a preset', shown('P1') === `1${NB}000,00${NB}₴`]);
      numberSelect.value = '__more';
      numberSelect.dispatchEvent(new win.Event('change', { bubbles: true }));
      checks.push(['toolbar "Інші формати…" opens the dialog', cfModal.classList.contains('active') && cfCategory.value === 'currency']);
      win.closeModal('cellFormatModal');

      // Проєкт: збереження .arttab, перевірка схеми й повторне відкриття.
      const downloads = [];
      const blobs = new Map();
      const origCreateUrl = win.URL.createObjectURL;
      const origAnchorClick = win.HTMLAnchorElement.prototype.click;
      win.URL.createObjectURL = function (blob) { const url = origCreateUrl.call(win.URL, blob); blobs.set(url, blob); return url; };
      win.HTMLAnchorElement.prototype.click = function () { if (this.download) { downloads.push({ name: this.download, blob: blobs.get(this.href) }); return undefined; } return origAnchorClick.call(this); };
      let savedProject = null;
      try {
        win.TablesWorkbookFile.exportWorkbook();
        savedProject = downloads.length ? JSON.parse(await downloads[0].blob.text()) : null;
      } finally {
        win.URL.createObjectURL = origCreateUrl;
        win.HTMLAnchorElement.prototype.click = origAnchorClick;
      }
      checks.push(['.arttab stores number formats in file version 5', savedProject?.version === 5 && savedProject.sheets[0].cellStyles.P1.includes('style-nf-cur-2-uah')
        && savedProject.sheets[0].cellStyles.P4 === 'style-nf-frac-1']);
      win.TablesWorkbookFile.applyWorkbookPayload(JSON.parse(JSON.stringify(savedProject)));
      await wait(50);
      checks.push(['project round-trip keeps formats and values', shown('P1') === `1${NB}000,00${NB}₴` && shown('P4') === '1 1/2' && shown('P6') === '007' && model().cellData.P1 === '1000']);
      checks.push(['schema rejects invalid number format classes', ['style-nf-num-11', 'style-nf-evil', 'style-nf-cur-2-gbp'].every(cls => validatorRejects({ sheets: [{ name: 'Аркуш1', cellStyles: { A1: cls } }] }))
        && !validatorRejects({ sheets: [{ name: 'Аркуш1', cellStyles: { A1: 'style-text-bold style-nf-pct-1' } }] })]);

      // Старі проєкти (без форматів і зі старими класами) відкриваються без змін.
      win.TablesWorkbookFile.applyWorkbookPayload({
        type: 'art-tables-workbook', version: 3, name: 'Старий', activeSheet: 0,
        sheets: [{ name: 'Аркуш1', rows: 60, cols: 30, cellData: { A1: '1234.5', B1: '0.25', C1: '12' }, cellStyles: { A1: 'style-num-fixed2', B1: 'style-num-percent', C1: 'style-text-bold' }, colWidths: {}, condRules: [] }]
      });
      await wait(50);
      checks.push(['old project with legacy format classes still displays them', plain(shown('A1')) === '1 234,50' && shown('B1') === '25%' && shown('C1') === '12']);
      selectCell('A1');
      checks.push(['legacy format is mapped to the matching toolbar preset', numberSelect.value === 'style-nf-num-2-t']);
      CFU.applyNumberFormatToken('style-nf-pct-0');
      checks.push(['changing a legacy format replaces the old class', shown('A1') === `123450${NB}%` && !/style-num-/.test(model().cellStyles.A1)]);
      win.TablesWorkbookFile.applyWorkbookPayload({
        type: 'art-tables-workbook', version: 4, name: 'Без форматів', activeSheet: 0,
        sheets: [{ name: 'Аркуш1', rows: 60, cols: 30, cellData: { A1: '5' }, cellStyles: { A1: 'style-text-bold' }, colWidths: {}, condRules: [] }]
      });
      await wait(50);
      checks.push(['old project without formats opens unchanged', shown('A1') === '5' && model().cellStyles.A1 === 'style-text-bold']);

      const failures = checks.filter(([, ok]) => !ok).map(([name]) => name);
      result.className = failures.length ? 'fail' : 'pass';
      result.textContent = checks.map(([name, ok]) => `${ok ? 'PASS' : 'FAIL'} ${name}`).join('\n') +
        `\n\n${failures.length ? 'FAILED' : 'PASSED'}`;
      document.body.dataset.tablesRender = failures.length ? 'failed' : 'passed';
    }

    run().catch(error => {
      result.className = 'fail';
      result.textContent = String(error && error.stack || error);
      document.body.dataset.tablesRender = 'failed';
    });
  </script>
</body>
</html>
