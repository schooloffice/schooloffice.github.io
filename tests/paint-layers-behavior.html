<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Paint Layers Smoke</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    iframe {
      width: 1280px;
      height: 900px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    pre {
      max-width: 1280px;
      white-space: pre-wrap;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: .75rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>Paint Layers Smoke</h1>
  <!-- Пілот растрових шарів: дві незалежні площини, порядок, видимість, історія й повний
       save/open. Окрема сторінка, щоб paint-behavior.html лишався в бюджеті віртуального часу. -->
  <pre id="result">Running...</pre>
  <iframe id="paintFrame" src="../paint/index.html"></iframe>

  <script>
    const result = document.getElementById('result');
    const frame = document.getElementById('paintFrame');
    const checks = [];
    const diagnostics = {};

    function check(label, ok, details) {
      checks.push({ label: details && !ok ? `${label} (${details})` : label, ok: !!ok });
    }

    // Опитуємо через setTimeout, а не requestAnimationFrame: під --virtual-time-budget
    // щільний rAF-цикл не дає віртуальному годиннику рухатися рівномірно.
    function waitFor(predicate, label, timeout = 8000) {
      const started = performance.now();
      return new Promise((resolve, reject) => {
        function tick() {
          let ok = false;
          try { ok = !!predicate(); } catch { ok = false; }
          if (ok) return resolve();
          if (performance.now() - started > timeout) return reject(new Error('Timed out waiting for ' + label));
          setTimeout(tick, 50);
        }
        tick();
      });
    }

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function run() {
      await waitFor(() => frame.contentWindow?.ArtMalyunky?.state?.layers?.length > 0, 'paint editor');
      const win = frame.contentWindow;
      const doc = win.document;
      const api = win.ArtMalyunky.canvasApi;
      const state = win.ArtMalyunky.state;

      const pixel = (canvas, x, y) => Array.from(canvas.getContext('2d').getImageData(x, y, 1, 1).data);
      const merged = (x, y) => pixel(api.exportMergedCanvas({ flatten: false }), x, y);
      const isColor = (rgba, r, g, b) => rgba[0] === r && rgba[1] === g && rgba[2] === b && rgba[3] === 255;
      const isClear = (rgba) => rgba[3] === 0;
      const paint = (color, x, y, w, h) => {
        const ctx = api.ctx;
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
        ctx.restore();
      };
      const names = () => api.layerList().map((layer) => layer.name);
      const rowNames = () => Array.from(doc.querySelectorAll('#layerList .layer-name')).map((node) => node.textContent);
      const clickAction = (action) => doc.querySelector(`[data-action="${action}"]`).click();
      const stageCanvases = () => doc.querySelectorAll('#canvasStage canvas').length;

      // Чистий старт: чернетка попередньої сесії не має впливати на перевірку.
      api.resetToSingleLayer();
      api.setDocumentSize(400, 300, { clear: true });
      win.ArtMalyunky.ui.setLayersMode(true);
      state.undoStack.length = 0;
      state.redoStack.length = 0;

      // 1. Новий малюнок — один шар, і в стопці рівно стільки полотен, скільки шарів плюс
      // службові (підкладка й виділення).
      check('старт: один шар «Шар 1»', names().join(',') === 'Шар 1', names().join(','));
      check('панель: режим «Шари» ховає параметри інструмента',
        doc.body.classList.contains('panel-layers')
        && !doc.getElementById('layersPanel').hidden
        && win.getComputedStyle(doc.querySelector('.panel-tool-area')).display === 'none');
      check('старт: рядок панелі показує шар', rowNames().join(',') === 'Шар 1', rowNames().join(','));
      const baseCanvases = stageCanvases();
      check('старт: у стопці полотно підкладки, шару й виділення', baseCanvases === 3, String(baseCanvases));

      // 2. Дві незалежні растрові площини.
      paint('#ff0000', 0, 0, 100, 100);
      clickAction('layer-add');
      await wait(60);
      paint('#0000ff', 50, 50, 100, 100);
      const [lower, upper] = state.layers;
      diagnostics.layers = names();
      check('додавання: два шари, активний — новий', names().length === 2 && api.activeLayer().id === upper.id);
      check('додавання: у стопці зʼявилося ще одне полотно', stageCanvases() === baseCanvases + 1, String(stageCanvases()));
      check('панель: список іде згори вниз', rowNames().join(',') === 'Шар 2,Шар 1', rowNames().join(','));
      check('незалежність: нижній шар тримає лише своє', isColor(pixel(lower.canvas, 20, 20), 255, 0, 0) && !isColor(pixel(lower.canvas, 120, 120), 0, 0, 255));
      check('незалежність: верхній шар прозорий там, де не малювали', isClear(pixel(upper.canvas, 20, 20)));
      check('зведення: верхній шар перекриває нижній', isColor(merged(75, 75), 0, 0, 255), JSON.stringify(merged(75, 75)));
      check('зведення: видно нижній там, де верхній порожній', isColor(merged(20, 20), 255, 0, 0), JSON.stringify(merged(20, 20)));

      // 3. Стирання у верхньому шарі відкриває нижній, а не замальовує фоном.
      api.clearRegion(50, 50, 30, 30);
      check('стирання: у верхньому шарі лишається прозоре', isClear(pixel(upper.canvas, 60, 60)));
      check('стирання: крізь дірку видно нижній шар', isColor(merged(60, 60), 255, 0, 0), JSON.stringify(merged(60, 60)));

      // 4. Заливка тримається меж видимого зображення, а фарба лягає в активний шар.
      state.currentColor = '#00ff00';
      state.activeColor = null;
      state.currentOpacity = 100;
      api.floodFill(300, 250);
      check('заливка: фарба в активному шарі', isColor(pixel(upper.canvas, 300, 250), 0, 255, 0), JSON.stringify(pixel(upper.canvas, 300, 250)));
      check('заливка: межу червоного квадрата не перетнуто', isClear(pixel(upper.canvas, 20, 20)) && isColor(pixel(lower.canvas, 20, 20), 255, 0, 0));

      // 5. Видимість: прихований шар зникає зі зведення, активним стає видимий.
      const topRowToggle = () => doc.querySelector('#layerList .layer-row .layer-visibility');
      topRowToggle().click();
      await wait(60);
      diagnostics.afterHide = { merged: merged(85, 85), active: api.activeLayer().name };
      check('видимість: прихований шар не потрапляє у зведення', isColor(merged(85, 85), 255, 255, 255) || isColor(merged(85, 85), 255, 0, 0), JSON.stringify(merged(85, 85)));
      check('видимість: активним став видимий шар', api.activeLayer().id === lower.id, api.activeLayer().name);
      check('видимість: кнопка рядка має aria-pressed', topRowToggle().getAttribute('aria-pressed') === 'false');
      topRowToggle().click();
      await wait(60);
      check('видимість: повернення показує шар знову', isColor(merged(85, 85), 0, 0, 255), JSON.stringify(merged(85, 85)));

      // 6. Порядок шарів і історія.
      api.setActiveLayer(upper.id);
      win.ArtMalyunky.ui.renderLayerList();

      doc.getElementById('layerDownBtn').click();
      await wait(60);
      // Точку беремо там, де малювали обидва шари й де немає стертої дірки.
      check('порядок: після «Нижче» зверху опиняється червоний', isColor(merged(90, 90), 255, 0, 0), JSON.stringify(merged(90, 90)));
      clickAction('undo');
      await wait(120);
      check('історія: undo повертає порядок', isColor(merged(90, 90), 0, 0, 255) && names().join(',') === 'Шар 1,Шар 2', JSON.stringify([names(), merged(90, 90)]));
      clickAction('redo');
      await wait(120);
      check('історія: redo знову змінює порядок', isColor(merged(90, 90), 255, 0, 0), JSON.stringify(merged(90, 90)));
      clickAction('undo');
      await wait(120);

      // 7. Поворот документа стосується всіх шарів.
      const beforeRotate = { width: state.document.width, height: state.document.height };
      api.rotate90('cw');
      const rotated = {
        size: [state.document.width, state.document.height],
        lower: pixel(state.layers[0].canvas, state.document.width - 20, 20),
        // Поворот за годинниковою: точка (x, y) стає (H - 1 - y, x), де H — стара висота.
        upper: pixel(state.layers[1].canvas, beforeRotate.height - 1 - 90, 90)
      };
      diagnostics.rotated = rotated;
      check('поворот: полотно повернулося', rotated.size[0] === beforeRotate.height && rotated.size[1] === beforeRotate.width, rotated.size.join('x'));
      check('поворот: обидва шари повернулися разом', isColor(rotated.lower, 255, 0, 0) && isColor(rotated.upper, 0, 0, 255), JSON.stringify(rotated));
      api.rotate90('ccw');

      // 8. Повний save/open: шари, назви, видимість і порядок переживають серіалізацію.
      api.renameLayer(state.layers[1].id, 'Небо');
      api.setLayerVisible(state.layers[1].id, false);
      const serial = api.toSerializable();
      diagnostics.serial = {
        layers: serial.layers.map((layer) => ({ name: layer.name, visible: layer.visible })),
        activeLayer: serial.activeLayer
      };
      check('збереження: у файл іде кожен шар окремим растром',
        Array.isArray(serial.layers) && serial.layers.length === 2
        && serial.layers.every((layer) => typeof layer.raster === 'string' && layer.raster.startsWith('data:image/png;base64,')));
      api.resetToSingleLayer();
      api.setDocumentSize(120, 90, { clear: true });
      await api.restoreSerializable(serial);
      check('відкриття: повернулися два шари з назвами й видимістю',
        names().join(',') === 'Шар 1,Небо'
        && api.layerList()[1].visible === false
        && state.document.width === 400,
        JSON.stringify({ names: names(), visible: api.layerList().map((l) => l.visible), width: state.document.width }));
      check('відкриття: пікселі кожного шару на місці',
        isColor(pixel(state.layers[0].canvas, 20, 20), 255, 0, 0) && isColor(pixel(state.layers[1].canvas, 120, 120), 0, 0, 255));

      // 9. Файл без шарів (версія 1) відкривається як один шар.
      const legacyRaster = api.exportMergedCanvas({ flatten: true }).toDataURL('image/png');
      await api.restoreSerializable({ document: { ...state.document }, raster: legacyRaster, objects: [], settings: {} });
      check('сумісність: старий файл із одним растром стає одним шаром',
        api.layerList().length === 1 && names()[0] === 'Шар 1', names().join(','));
      check('сумісність: малюнок зі старого файла видно', isColor(merged(20, 20), 255, 0, 0), JSON.stringify(merged(20, 20)));

      // 10. Зведення шарів і межа кількості.
      api.addLayer('Другий');
      api.setActiveLayer(state.layers[1].id);
      paint('#00a000', 200, 40, 40, 40);
      api.flattenLayers();
      check('зведення шарів: лишається один шар із тим самим зображенням',
        api.layerList().length === 1 && isColor(merged(210, 50), 0, 160, 0) && isColor(merged(20, 20), 255, 0, 0),
        JSON.stringify({ count: api.layerList().length, merged: merged(210, 50) }));
      let added = 0;
      while (api.addLayer()) added += 1;
      const limit = win.ArtMalyunky.constants.MAX_LAYERS;
      check('межа: більше за ліміт шарів не додається',
        api.layerList().length === limit && added === limit - 1, `${api.layerList().length}/${limit}`);

      const failed = checks.filter((item) => !item.ok);
      result.textContent = checks
        .map((item) => (item.ok ? 'PASS ' : 'FAIL ') + item.label)
        .concat([
          '',
          'Diagnostics:',
          JSON.stringify(diagnostics),
          // Під --virtual-time-budget це віртуальний час сторінки: бюджет раннера — 35000 мс.
          'virtual time ms: ' + Math.round(performance.now())
        ])
        .concat(failed.length ? ['FAILED: ' + failed.map((item) => item.label).join('; ')] : ['PASSED'])
        .join('\n');

      document.body.dataset.paintLayers = failed.length ? 'failed' : 'passed';
    }

    run().catch((err) => {
      document.body.dataset.paintLayers = 'failed';
      const previous = result.textContent === 'Running...' ? '' : result.textContent + String.fromCharCode(10, 10);
      result.textContent = previous + (err && (err.stack || err.message) ? (err.stack || err.message) : String(err));
    });
  </script>
</body>
</html>
