<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tables Formula Behavior</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #162033; }
    pre { white-space: pre-wrap; padding: 16px; border: 1px solid #d6dce5; border-radius: 8px; background: #f8fafc; }
    .pass { color: #15803d; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Tables Formula Behavior</h1>
  <pre id="result">Running...</pre>

  <script src="../tables/js/addressing.js"></script>
  <script src="../tables/js/model.js"></script>
  <script src="../tables/js/storage.js"></script>
  <script src="../tables/js/formula-parser.js"></script>
  <script src="../tables/js/formula-references.js"></script>
  <script src="../tables/js/formula-functions.js"></script>
  <script src="../tables/js/formula-engine.js"></script>
  <script src="../tables/js/core.js"></script>
  <script src="../tables/js/state.js"></script>
  <script src="../tables/js/formula-bar.js"></script>
  <script src="../tables/js/grid.js"></script>
  <script src="../tables/js/clipboard.js"></script>
  <script src="../tables/js/cell-format-ui.js"></script>
  <script>
    const result = document.getElementById('result');

    function assertEqual(name, actual, expected) {
      if (Object.is(actual, expected)) return `PASS ${name}`;
      throw new Error(`${name}: expected ${expected}, got ${actual}`);
    }

    function assertThrows(name, fn, expectedMessage) {
      try {
        fn();
      } catch (e) {
        return assertEqual(name, e && e.message, expectedMessage);
      }
      throw new Error(`${name}: expected throw ${expectedMessage}, but nothing was thrown`);
    }

    try {
      localStorage.clear();
      setGridSize(20, 10);
      selStart = { c: 0, r: 1 };
      selEnd = { c: 1, r: 2 };
      cellData = {
        A1: '10',
        A2: '20',
        A3: '30',
        B1: '5',
        B2: '=A1+B1',
        C1: 'текст'
      };

      const checks = [
        assertEqual('SUM range', evaluateFormula('SUM(A1:A3)'), 60),
        assertEqual('AVERAGE range', evaluateFormula('AVERAGE(A1:A3)'), 20),
        assertEqual('AVG alias still works', evaluateFormula('AVG(A1:A3)'), 20),
        assertEqual('COUNT range', evaluateFormula('COUNT(A1:C1)'), 2),
        assertEqual('COUNTA range', evaluateFormula('COUNTA(A1:C1)'), 3),
        assertEqual('IF comparison true', evaluateFormula('IF(A1>=10,1,0)'), 1),
        assertEqual('IF comparison false', evaluateFormula('IF(A1>10,1,0)'), 0),
        assertEqual('AND comparison', evaluateFormula('AND(A1=10,B1<10)'), 1),
        assertEqual('OR comparison', evaluateFormula('OR(A1=5,B1=5)'), 1),
        assertEqual('NOT comparison', evaluateFormula('NOT(A1=5)'), 1),
        assertEqual('MOD', evaluateFormula('MOD(A3,20)'), 10),
        assertEqual('INT', evaluateFormula('INT(12.9)'), 12),
        assertEqual('CEILING', evaluateFormula('CEILING(12.1)'), 13),
        assertEqual('percent literal', evaluateFormula('200*15%'), 30),
        assertEqual('cell formula reference', evaluateFormula('B2*2'), 30),
        // AST-рушій: можливості, недоступні старому регексп-двигуну
        assertEqual('absolute reference', evaluateFormula('$A$1+$B$1'), 15),
        assertEqual('mixed reference', evaluateFormula('A$1+$B1'), 15),
        assertEqual('nested same-name function', evaluateFormula('MAX(MAX(A1:A3),5)'), 30),
        assertEqual('nested round+average', evaluateFormula('ROUND(AVERAGE(A1:A3),0)'), 20),
        assertEqual('range plus scalar arg', evaluateFormula('SUM(A1:A3,B1)'), 65),
        assertEqual('text cell result', evaluateFormula('C1'), 'текст'),
        assertEqual('string equality in IF', evaluateFormula('IF(C1="текст",1,0)'), 1),
        assertEqual('lazy IF skips error branch', evaluateFormula('IF(B1=5,42,100/0)'), 42),
        assertEqual('AVERAGE ignores text', evaluateFormula('AVERAGE(A1:C1)'), 7.5),
        // Wave 2.1: умовні функції
        assertEqual('COUNTIF greater', evaluateFormula('COUNTIF(A1:A3,">15")'), 2),
        assertEqual('COUNTIF exact', evaluateFormula('COUNTIF(A1:A3,10)'), 1),
        assertEqual('SUMIF range', evaluateFormula('SUMIF(A1:A3,">=10")'), 60),
        assertEqual('AVERAGEIF range', evaluateFormula('AVERAGEIF(A1:A3,">=20")'), 25),
        // shiftFormulaRefs: тепер через токенайзер, поважає $ і рядки
        // Структурний зсув (вставка/видалення рядків): абсолютні теж зсуваються
        assertEqual('shift relative refs', shiftFormulaRefs('=A1+B2', { rowAt: 1, rowDelta: 1, local: true }), '=A2+B3'),
        assertEqual('shift adjusts absolute on insert', shiftFormulaRefs('=$A$1+B2', { rowAt: 1, rowDelta: 1, local: true }), '=$A$2+B3'),
        assertEqual('shift mixed refs', shiftFormulaRefs('=A$1+$A1', { rowAt: 1, rowDelta: 1, local: true }), '=A$2+$A2'),
        assertEqual('shift columns', shiftFormulaRefs('=A1+B1', { colAt: 0, colDelta: 1, local: true }), '=B1+C1'),
        assertEqual('shift adjusts absolute column', shiftFormulaRefs('=$A1+B1', { colAt: 0, colDelta: 1, local: true }), '=$B1+C1'),
        assertEqual('shift range', shiftFormulaRefs('=SUM(A1:A3)', { rowAt: 1, rowDelta: 1, local: true }), '=SUM(A2:A4)'),
        assertEqual('shift skips string literal', shiftFormulaRefs('=IF(A1="A1",1,0)', { rowAt: 1, rowDelta: 1, local: true }), '=IF(A2="A1",1,0)'),
        // Видалення рядків → #REF! для видалених клітинок
        assertEqual('delete row makes #REF!', shiftFormulaRefs('=A1+A5', { rowAt: 1, rowDelta: -1, local: true }), '=#REF!+A4'),
        assertEqual('delete inside range shrinks it', shiftFormulaRefs('=SUM(A1:A5)', { rowAt: 3, rowDelta: -1, local: true }), '=SUM(A1:A4)'),
        assertEqual('delete first range row shrinks it', shiftFormulaRefs('=SUM(A1:A5)', { rowAt: 1, rowDelta: -1, local: true }), '=SUM(A1:A4)'),
        assertEqual('delete last range row shrinks it', shiftFormulaRefs('=SUM(A1:A5)', { rowAt: 5, rowDelta: -1, local: true }), '=SUM(A1:A4)'),
        assertEqual('delete first range column shrinks it', shiftFormulaRefs('=SUM(A1:E1)', { colAt: 0, colDelta: -1, local: true }), '=SUM(A1:D1)'),
        assertEqual('delete whole range → #REF!', shiftFormulaRefs('=SUM(A1:A3)', { rowAt: 1, rowDelta: -3, local: true }), '=SUM(#REF!)'),
        assertEqual('rename sheet refs', renameSheetRefs('=Аркуш2!A1+B1', 'Аркуш2', 'Журнал'), '=Журнал!A1+B1'),
        assertEqual('delete sheet ref becomes #REF!', deleteSheetRefs('=Аркуш2!A1+B1', 'Аркуш2'), '=#REF!+B1'),
        assertEqual('delete sheet range becomes #REF!', deleteSheetRefs('=SUM(Аркуш2!A1:A5)', 'Аркуш2'), '=SUM(#REF!)'),
        // F4 reference cycling: A1 → $A$1 → A$1 → $A1 → A1
        assertEqual('F4 rel→abs', TablesFormulaBar.computeReferenceCycle('=A1', 3).value, '=$A$1'),
        assertEqual('F4 abs→rowabs', TablesFormulaBar.computeReferenceCycle('=$A$1', 5).value, '=A$1'),
        assertEqual('F4 rowabs→colabs', TablesFormulaBar.computeReferenceCycle('=A$1', 4).value, '=$A1'),
        assertEqual('F4 colabs→rel', TablesFormulaBar.computeReferenceCycle('=$A1', 4).value, '=A1'),
        assertEqual('F4 targets ref at caret', TablesFormulaBar.computeReferenceCycle('=A1+B2', 2).value, '=$A$1+B2'),
        assertEqual('F4 ignores non-formula', TablesFormulaBar.computeReferenceCycle('A1', 2), null),
        // offsetFormulaRefs: зсув усіх відносних посилань на дельту (для копіювання)
        assertEqual('offset shifts relative', offsetFormulaRefs('=A1+$B$2', 2, 1), '=B3+$B$2'),
        assertEqual('offset keeps absolute row', offsetFormulaRefs('=A$1', 2, 1), '=B$1'),
        assertEqual('offset clamps to bounds', offsetFormulaRefs('=A1', -5, -5), '=A1'),
        assertEqual('offset preserves cross-sheet', offsetFormulaRefs('=Аркуш2!A1+B1', 1, 0), '=Аркуш2!A2+B2'),
        assertEqual('structure skips other-sheet ref', shiftFormulaRefs('=Аркуш2!A1+B1', { rowAt: 1, rowDelta: 1, sheet: 'Аркуш1', local: true }), '=Аркуш2!A1+B2'),
        assertEqual('structure shifts ref to modified sheet', shiftFormulaRefs('=Аркуш2!A1', { rowAt: 1, rowDelta: 1, sheet: 'Аркуш2', local: false }), '=Аркуш2!A2'),
        assertEqual('structure shifts inherited range sheet', shiftFormulaRefs('=SUM(Аркуш2!A1:A5)', { rowAt: 1, rowDelta: 1, sheet: 'Аркуш2', local: false }), '=SUM(Аркуш2!A2:A6)'),
        assertEqual('structure shrinks inherited range sheet', shiftFormulaRefs('=SUM(Аркуш2!A1:A5)', { rowAt: 1, rowDelta: -1, sheet: 'Аркуш2', local: false }), '=SUM(Аркуш2!A1:A4)'),
        // computeFillRaw: числові серії та повтор зразка
        assertEqual('fill series step 1', computeFillRaw(['1', '2'], 2).raw, '3'),
        assertEqual('fill series continues', computeFillRaw(['1', '2'], 4).raw, '5'),
        assertEqual('fill single number copies', computeFillRaw(['5'], 3).raw, '5'),
        assertEqual('fill series step 2', computeFillRaw(['2', '4'], 2).raw, '6'),
        assertEqual('fill text repeats', computeFillRaw(['Пн'], 2).raw, 'Пн'),
        assertEqual('fill formula is pattern', computeFillRaw(['=A1'], 1).type, 'pattern'),
        assertEqual('clipboard TSV serialization', TablesClipboard.serializeSelectionToTsv(), '10\t5\n20\t=A1+B1')
      ];

      TablesClipboard.applyTsvToGridData('7\t8\n9\t10', 4, 4);
      checks.push(assertEqual('clipboard paste top-left', cellData.E4, '7'));
      checks.push(assertEqual('clipboard paste bottom-right', cellData.F5, '10'));

      // Wave 1.2: внутрішнє копіювання зберігає формули і зсуває відносні посилання
      cellData = { A1: '10', A2: '20', C1: '=A1+5', C2: '=$A$1+A2' };
      selStart = { c: 2, r: 1 };
      selEnd = { c: 2, r: 2 }; // C1:C2
      TablesClipboard.copySelectionToClipboard();
      const copiedFormulas = TablesClipboard.serializeSelectionToTsv();
      checks.push(assertEqual('internal paste detected', TablesClipboard.isInternalPaste(copiedFormulas), true));
      TablesClipboard.applyTsvToGridData(copiedFormulas, 3, 3); // вставка верхнім-лівим у D3
      checks.push(assertEqual('copy shifts relative ref', cellData.D3, '=B3+5'));
      checks.push(assertEqual('copy keeps absolute ref', cellData.D4, '=$A$1+B4'));

      // Wave 1.3: автозаповнення (серії, формули, вгору)
      cellData = { A1: '1', A2: '2' };
      applyAutoFill({ cMin: 0, cMax: 0, rMin: 1, rMax: 2 }, { cMin: 0, cMax: 0, rMin: 1, rMax: 5 });
      checks.push(assertEqual('autofill numeric series A3', cellData.A3, '3'));
      checks.push(assertEqual('autofill numeric series A5', cellData.A5, '5'));

      cellData = { D1: '=A1*2' };
      applyAutoFill({ cMin: 3, cMax: 3, rMin: 1, rMax: 1 }, { cMin: 3, cMax: 3, rMin: 1, rMax: 3 });
      checks.push(assertEqual('autofill formula down D2', cellData.D2, '=A2*2'));
      checks.push(assertEqual('autofill formula down D3', cellData.D3, '=A3*2'));

      cellData = { A5: '=A4' };
      applyAutoFill({ cMin: 0, cMax: 0, rMin: 5, rMax: 5 }, { cMin: 0, cMax: 2, rMin: 5, rMax: 5 });
      checks.push(assertEqual('autofill formula right B5', cellData.B5, '=B4'));
      checks.push(assertEqual('autofill formula right C5', cellData.C5, '=C4'));

      cellData = { A8: '3', A9: '4' };
      applyAutoFill({ cMin: 0, cMax: 0, rMin: 8, rMax: 9 }, { cMin: 0, cMax: 0, rMin: 6, rMax: 9 });
      checks.push(assertEqual('autofill up series A7', cellData.A7, '2'));
      checks.push(assertEqual('autofill up series A6', cellData.A6, '1'));

      // Wave 2.1: SUMIF/COUNTIF з текстовим критерієм і окремим sum_range
      cellData = { A1: 'Іванов', A2: 'Петров', A3: 'Іванов', B1: '10', B2: '20', B3: '30' };
      checks.push(assertEqual('COUNTIF text criterion', evaluateFormula('COUNTIF(A1:A3,"Іванов")'), 2));
      checks.push(assertEqual('SUMIF with sum_range', evaluateFormula('SUMIF(A1:A3,"Іванов",B1:B3)'), 40));
      checks.push(assertEqual('AVERAGEIF with avg_range', evaluateFormula('AVERAGEIF(A1:A3,"Іванов",B1:B3)'), 20));

      // Wave 2.4: дати (серійні номери + формат)
      checks.push(assertEqual('DATE round-trip', serialToDateString(ymdToSerial(2026, 6, 6), false), '06.06.2026'));
      checks.push(assertEqual('DATE plus days', serialToDateString(ymdToSerial(2026, 6, 6) + 7, false), '13.06.2026'));
      checks.push(assertEqual('DATE function returns serial', evaluateFormula('DATE(2026,6,6)'), ymdToSerial(2026, 6, 6)));
      checks.push(assertEqual('date difference in days', evaluateFormula('DATE(2026,6,13)-DATE(2026,6,6)'), 7));
      checks.push(assertEqual('TODAY returns serial', evaluateFormula('TODAY()'), todaySerial()));
      const dateTd = document.createElement('td');
      dateTd.classList.add('style-num-date');
      checks.push(assertEqual('date number format display', formatDisplayValue(ymdToSerial(2026, 6, 6), dateTd), '06.06.2026'));

      // Wave 3.2: міжаркушеві посилання
      cellData = { A1: '10', B1: '5' };
      sheets = [
        { name: 'Аркуш1', cellData: cellData, cellStyles: {}, colWidths: {}, condRules: [], rows: ROWS, cols: COL_COUNT },
        { name: 'Аркуш2', cellData: { A1: '100', A2: '200', A3: '=A1+A2', A100: '42' }, cellStyles: {}, colWidths: {}, condRules: [], rows: 100, cols: COL_COUNT }
      ];
      activeSheet = 0;
      checks.push(assertEqual('cross-sheet ref', evaluateFormula('Аркуш2!A1'), 100));
      checks.push(assertEqual('cross-sheet range sum', evaluateFormula('SUM(Аркуш2!A1:A2)'), 300));
      checks.push(assertEqual('cross-sheet formula cell', evaluateFormula('Аркуш2!A3'), 300));
      checks.push(assertEqual('mix active and cross-sheet', evaluateFormula('A1+Аркуш2!A1'), 110));
      checks.push(assertEqual('cross-sheet beyond active size', evaluateFormula('Аркуш2!A100'), 42));
      checks.push(assertThrows('unknown sheet → #REF!', () => evaluateFormula('НемаТакого!A1'), '#REF!'));
      checks.push(assertThrows('#REF! literal evaluates', () => evaluateFormula('#REF!'), '#REF!'));
      sheets[1].name = 'Мій аркуш';
      checks.push(assertEqual('quoted sheet name', evaluateFormula("'Мій аркуш'!A2"), 200));

      // Selection stats must ignore empty cells (Number('') === 0 regression)
      cellData = { A1: '10', A2: '20', A3: '30', B1: '-5', B3: '-2' };
      selStart = { c: 0, r: 0 };
      selEnd = { c: 0, r: 4 }; // A1:A5, with A4 and A5 empty
      const statsA = getSelectionStats();
      checks.push(assertEqual('stats count ignores empty', statsA.count, 3));
      checks.push(assertEqual('stats countNumbers ignores empty', statsA.countNumbers, 3));
      checks.push(assertEqual('stats sum', statsA.sum, 60));
      checks.push(assertEqual('stats min ignores empty', statsA.min, 10));
      checks.push(assertEqual('stats max', statsA.max, 30));
      checks.push(assertEqual('stats avg', statsA.avg, 20));

      selStart = { c: 1, r: 0 };
      selEnd = { c: 1, r: 4 }; // B1:B5, negatives with empty B2/B4/B5
      const statsB = getSelectionStats();
      checks.push(assertEqual('stats max not zeroed by empty', statsB.max, -2));
      checks.push(assertEqual('stats min negative', statsB.min, -5));
      checks.push(assertEqual('stats countNumbers negatives', statsB.countNumbers, 2));

      // Standard formula error codes (Excel/Sheets-сумісні)
      cellData = { A1: '10', E1: '=E1' };
      checks.push(assertThrows('error #DIV/0!', () => evaluateFormula('1/0'), '#DIV/0!'));
      checks.push(assertThrows('error #DIV/0! via MOD', () => evaluateFormula('MOD(5,0)'), '#DIV/0!'));
      checks.push(assertThrows('error #NAME?', () => evaluateFormula('FOO(1)'), '#NAME?'));
      checks.push(assertThrows('error #NUM! sqrt', () => evaluateFormula('SQRT(-1)'), '#NUM!'));
      checks.push(assertThrows('error #CIRC!', () => evaluateFormula('E1'), '#CIRC!'));

      // ---- Хвиля: пошук, підстановка, текст, округлення ----
      // Журнал: A=прізвище, B=бал, C=предмет. Відсортований за B за зростанням,
      // щоб перевірити і точний, і наближений пошук.
      setGridSize(20, 10);
      cellData = {
        A1: 'Прізвище', B1: 'Бал', C1: 'Предмет',
        A2: 'Бондаренко', B2: '4', C2: 'фізика',
        A3: 'Коваленко', B3: '6', C3: 'хімія',
        A4: 'Іваненко', B4: '8', C4: 'біологія',
        A5: 'Петренко', B5: '11', C5: 'математика',
        D1: 'Іваненко',
        E1: '', E2: '=1/0'
      };

      // VLOOKUP: точний пошук за текстом у першому стовпці.
      checks.push(assertEqual('VLOOKUP точний: бал',
        evaluateFormula('VLOOKUP("Іваненко",A2:C5,2,FALSE)'), 8));
      checks.push(assertEqual('VLOOKUP точний: предмет',
        evaluateFormula('VLOOKUP("Іваненко",A2:C5,3,FALSE)'), 'біологія'));
      checks.push(assertEqual('VLOOKUP точний: пошук за посиланням',
        evaluateFormula('VLOOKUP(D1,A2:C5,2,FALSE)'), 8));
      checks.push(assertEqual('VLOOKUP точний: регістр не має значення',
        evaluateFormula('VLOOKUP("іваненко",A2:C5,2,FALSE)'), 8));
      checks.push(assertThrows('VLOOKUP точний: не знайдено → #N/A',
        () => evaluateFormula('VLOOKUP("Сидоренко",A2:C5,2,FALSE)'), '#N/A'));
      checks.push(assertThrows('VLOOKUP: стовпець поза таблицею → #REF!',
        () => evaluateFormula('VLOOKUP("Іваненко",A2:C5,9,FALSE)'), '#REF!'));
      checks.push(assertThrows('VLOOKUP: номер стовпця < 1 → #VALUE!',
        () => evaluateFormula('VLOOKUP("Іваненко",A2:C5,0,FALSE)'), '#VALUE!'));

      // VLOOKUP наближений (за замовчуванням, як в Excel): найбільше значення ≤ шуканого.
      checks.push(assertEqual('VLOOKUP наближений: точний збіг',
        evaluateFormula('VLOOKUP(8,B2:C5,2)'), 'біологія'));
      checks.push(assertEqual('VLOOKUP наближений: між значеннями',
        evaluateFormula('VLOOKUP(7,B2:C5,2)'), 'хімія'));
      checks.push(assertEqual('VLOOKUP наближений: більше за все',
        evaluateFormula('VLOOKUP(99,B2:C5,2)'), 'математика'));
      checks.push(assertThrows('VLOOKUP наближений: менше за все → #N/A',
        () => evaluateFormula('VLOOKUP(1,B2:C5,2)'), '#N/A'));

      // MATCH
      checks.push(assertEqual('MATCH точний у стовпці',
        evaluateFormula('MATCH("Петренко",A2:A5,0)'), 4));
      checks.push(assertEqual('MATCH точний у рядку',
        evaluateFormula('MATCH("Бал",A1:C1,0)'), 2));
      checks.push(assertEqual('MATCH наближений', evaluateFormula('MATCH(7,B2:B5,1)'), 2));
      checks.push(assertThrows('MATCH не знайдено → #N/A',
        () => evaluateFormula('MATCH("Сидоренко",A2:A5,0)'), '#N/A'));

      // INDEX
      checks.push(assertEqual('INDEX двовимірний', evaluateFormula('INDEX(A2:C5,3,1)'), 'Іваненко'));
      checks.push(assertEqual('INDEX одновимірний стовпець', evaluateFormula('INDEX(A2:A5,2)'), 'Коваленко'));
      checks.push(assertEqual('INDEX одновимірний рядок', evaluateFormula('INDEX(A1:C1,3)'), 'Предмет'));
      checks.push(assertThrows('INDEX поза межами → #REF!',
        () => evaluateFormula('INDEX(A2:C5,9,1)'), '#REF!'));

      // INDEX+MATCH разом — типова шкільна зв'язка.
      checks.push(assertEqual('INDEX+MATCH',
        evaluateFormula('INDEX(C2:C5,MATCH("Коваленко",A2:A5,0))'), 'хімія'));

      // IFERROR
      checks.push(assertEqual('IFERROR ловить #DIV/0!', evaluateFormula('IFERROR(1/0,"—")'), '—'));
      checks.push(assertEqual('IFERROR ловить #N/A',
        evaluateFormula('IFERROR(VLOOKUP("Сидоренко",A2:C5,2,FALSE),0)'), 0));
      checks.push(assertEqual('IFERROR пропускає успішне значення',
        evaluateFormula('IFERROR(2+2,"—")'), 4));
      checks.push(assertEqual('IFERROR ловить помилку з іншої клітинки',
        evaluateFormula('IFERROR(E2,"хиба")'), 'хиба'));

      // RANK: бали 8, 8, 5, 10, 12 — однакові значення дістають однаковий ранг.
      // За спаданням: 12(1) 10(2) 8(3) 8(3) 5(5); за зростанням: 5(1) 8(2) 8(2) 10(4) 12(5).
      cellData.F1 = '8'; cellData.F2 = '8'; cellData.F3 = '5'; cellData.F4 = '10'; cellData.F5 = '12';
      checks.push(assertEqual('RANK за спаданням', evaluateFormula('RANK(8,F1:F5)'), 3));
      checks.push(assertEqual('RANK найбільшого', evaluateFormula('RANK(12,F1:F5)'), 1));
      checks.push(assertEqual('RANK найменшого', evaluateFormula('RANK(5,F1:F5)'), 5));
      checks.push(assertEqual('RANK за зростанням', evaluateFormula('RANK(8,F1:F5,1)'), 2));
      checks.push(assertEqual('RANK за зростанням: найменше стає першим',
        evaluateFormula('RANK(5,F1:F5,1)'), 1));
      checks.push(assertThrows('RANK: значення відсутнє → #N/A',
        () => evaluateFormula('RANK(7,F1:F5)'), '#N/A'));

      // Округлення від нуля / до нуля, зокрема для від'ємних.
      checks.push(assertEqual('ROUNDUP додатне', evaluateFormula('ROUNDUP(2.111,2)'), 2.12));
      checks.push(assertEqual('ROUNDDOWN додатне', evaluateFormula('ROUNDDOWN(2.119,2)'), 2.11));
      checks.push(assertEqual('ROUNDUP від нуля для від’ємного', evaluateFormula('ROUNDUP(-2.111,2)'), -2.12));
      checks.push(assertEqual('ROUNDDOWN до нуля для від’ємного', evaluateFormula('ROUNDDOWN(-2.119,2)'), -2.11));
      checks.push(assertEqual('ROUNDUP без розрядів', evaluateFormula('ROUNDUP(2.01)'), 3));
      checks.push(assertEqual('ROUNDDOWN без розрядів', evaluateFormula('ROUNDDOWN(2.99)'), 2));

      // Текстові
      cellData.G1 = 'Іваненко Марія';
      checks.push(assertEqual('LEN', evaluateFormula('LEN(G1)'), 14));
      checks.push(assertEqual('LEN числа', evaluateFormula('LEN(12345)'), 5));
      checks.push(assertEqual('LEFT', evaluateFormula('LEFT(G1,8)'), 'Іваненко'));
      checks.push(assertEqual('LEFT без аргументу', evaluateFormula('LEFT(G1)'), 'І'));
      checks.push(assertEqual('RIGHT', evaluateFormula('RIGHT(G1,5)'), 'Марія'));
      checks.push(assertEqual('RIGHT довше за рядок', evaluateFormula('RIGHT(G1,99)'), 'Іваненко Марія'));
      checks.push(assertEqual('MID', evaluateFormula('MID(G1,10,5)'), 'Марія'));
      checks.push(assertEqual('MID за межею', evaluateFormula('MID(G1,99,5)'), ''));
      checks.push(assertThrows('MID: початок < 1 → #VALUE!',
        () => evaluateFormula('MID(G1,0,5)'), '#VALUE!'));
      checks.push(assertEqual('CONCAT', evaluateFormula('CONCAT("7-",A2)'), '7-Бондаренко'));
      checks.push(assertEqual('CONCAT діапазону', evaluateFormula('CONCAT(A2:A3)'), 'БондаренкоКоваленко'));
      checks.push(assertEqual('CONCATENATE аліас', evaluateFormula('CONCATENATE("а","б","в")'), 'абв'));

      // Літерал #N/A має розбиратися парсером (трапляється в імпортованих книгах).
      checks.push(assertThrows('літерал #N/A', () => evaluateFormula('#N/A'), '#N/A'));

      result.className = 'pass';
      result.textContent = checks.join('\n') + '\n\nPASSED';
      document.body.dataset.tablesFormula = 'passed';
    } catch (error) {
      result.className = 'fail';
      result.textContent = String(error && error.stack || error);
      document.body.dataset.tablesFormula = 'failed';
    }
  </script>
