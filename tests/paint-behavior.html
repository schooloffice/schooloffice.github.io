<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint Behavior</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #162033; }
    iframe { width: 960px; height: 540px; border: 1px solid #d6dce5; border-radius: 8px; }
    pre { white-space: pre-wrap; padding: 16px; border: 1px solid #d6dce5; border-radius: 8px; background: #f8fafc; }
    .pass { color: #15803d; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Paint Behavior</h1>
  <pre id="result">Running...</pre>
  <iframe id="paintFrame" src="../paint/index.html"></iframe>

  <script>
    const result = document.getElementById('result');
    const frame = document.getElementById('paintFrame');

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function waitFor(predicate, label, timeout = 7000) {
      const start = performance.now();
      while (performance.now() - start < timeout) {
        if (predicate()) return;
        await wait(100);
      }
      throw new Error(label);
    }

    function check(name, ok) {
      if (!ok) throw new Error(name);
      return `PASS ${name}`;
    }

    async function run() {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('paint iframe load timed out')), 7000);
        frame.addEventListener('load', () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });

      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      await waitFor(() => typeof win.PaintApp?.boot === 'function', 'PaintApp boot exported');
      await waitFor(() => win.ArtMalyunky?.canvasApi?.canvas?.width > 0, 'paint canvas initialized');

      const canvas = doc.querySelector('#drawingCanvas');
      const { state, canvasApi } = win.ArtMalyunky;
      state.currentTool = 'shapes';
      state.currentShape = 'rect';
      canvasApi.createPendingShape(20, 20, 120, 90);
      const created = canvasApi.commitPendingObject();
      canvasApi.renderObjects();
      await waitFor(() => doc.querySelectorAll('.art-object').length === 1, 'paint object rendered');
      doc.querySelector('.art-object').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await waitFor(() => doc.querySelector('.art-object.selected'), 'paint object selected');
      const beforeX = created.x;
      canvasApi.updateObject(created.id, { x: beforeX + 12 });

      // Базові перевірки (залежать від виділеного об'єкта) рахуємо ДО регресійного блоку,
      // бо setDocumentSize/restoreSnapshot нижче скидають selection.
      const baseChecks = [
        check('PaintApp boot exported', typeof win.PaintApp?.boot === 'function'),
        check('document module exported', typeof win.ArtMalyunky?.paintDocument?.createPaintDocument === 'function'),
        check('object interaction module exported', typeof win.ArtMalyunky?.objectInteractions?.createPaintObjectInteractions === 'function'),
        check('canvas api initialized', !!win.ArtMalyunky?.canvasApi?.canvas),
        check('drawing canvas has dimensions', canvas.width > 0 && canvas.height > 0),
        check('object rendered', doc.querySelectorAll('.art-object').length === 1),
        check('object selected', state.selectedObjectId === created.id),
        check('object update works', canvasApi.getObjectById(created.id).x === beforeX + 12),
        check('standard commands exported', ['new', 'open', 'save', 'undo', 'redo'].every(command => !!doc.querySelector(`[data-office-command="${command}"]`))),
        check('toolbar status rendered', !!doc.querySelector('#statusTool') && !!doc.querySelector('#statusCanvas')),
        check('zoom status rendered', !!doc.querySelector('#statusZoom') && !!doc.querySelector('#zoomLevelLabel'))
      ];

      // --- Регресія моделі документа (Ітерація 1) ---
      // 5. Новий розмір документа дає саме задані dimensions.
      canvasApi.setDocumentSize(640, 480, { clear: true });
      const sizeSet = canvas.width === 640 && canvas.height === 480
        && state.document.width === 640 && state.document.height === 480;

      // 2. Resize вікна не спотворює растр і не змінює розмір документа.
      canvasApi.fillBackground();
      canvasApi.ctx.fillStyle = '#ff0000';
      canvasApi.ctx.fillRect(10, 10, 4, 4);
      const pixelBefore = canvasApi.ctx.getImageData(11, 11, 1, 1).data.join(',');
      win.dispatchEvent(new Event('resize'));
      await wait(220);
      const pixelAfter = canvasApi.ctx.getImageData(11, 11, 1, 1).data.join(',');
      const docStableAfterResize = canvas.width === 640 && canvas.height === 480;
      const rasterStableAfterResize = pixelBefore === pixelAfter;

      // 6. Fit-to-window змінює лише zoom, а не пікселі документа.
      const beforeFitW = canvas.width;
      const beforeFitH = canvas.height;
      canvasApi.fitDocumentToViewport();
      const fitKeepsPixels = canvas.width === beforeFitW && canvas.height === beforeFitH;

      // 3. Координати документа узгоджені з розміром полотна при різному zoom.
      const docXAtCenter = () => {
        const r = canvas.getBoundingClientRect();
        return canvasApi.getPointerPosition({ clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }).x;
      };
      canvasApi.setZoom(1);
      const centerAt1 = Math.abs(docXAtCenter() - canvas.width / 2) <= 2;
      canvasApi.setZoom(4);
      const centerAt4 = Math.abs(docXAtCenter() - canvas.width / 2) <= 2;
      canvasApi.setZoom(1);
      const coordsConsistent = centerAt1 && centerAt4;

      // 4. Undo відновлює розмір документа.
      canvasApi.setDocumentSize(800, 600, { clear: true });
      const undoSnapshot = canvasApi.snapshot();
      canvasApi.setDocumentSize(400, 300, { clear: true });
      await canvasApi.restoreSnapshot(undoSnapshot);
      const undoRestoresSize = canvas.width === 800 && canvas.height === 600;

      // --- Розкладка Ітерації 2 (ліва панель) ---
      const railTools = doc.querySelectorAll('.tool-rail .rail-tool[data-tool]');
      const hasRail = railTools.length === 8 && doc.querySelector('.tool-rail.office-toolbar');
      const hasProps = !!doc.querySelector('.properties-panel');
      state.currentTool = 'brush';
      win.ArtMalyunky.ui.updateToolSections();
      const brushShown = !doc.getElementById('propBrush').classList.contains('hidden');
      state.currentTool = 'fill';
      win.ArtMalyunky.ui.updateToolSections();
      const brushHidden = doc.getElementById('propBrush').classList.contains('hidden');
      const contextualSections = brushShown && brushHidden;

      // --- E2E: малювання при zoom потрапляє в правильний піксель (координати + синхронна історія) ---
      canvasApi.setDocumentSize(800, 600, { clear: true });
      state.currentTool = 'brush';
      state.currentBrush = 'pen';
      state.currentColor = '#ff0000';
      state.currentSize = 14;
      canvasApi.setZoom(3);
      const target = { x: 200, y: 150 };
      const cpt = canvasApi.docToClient(target.x, target.y);
      canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: cpt.x, clientY: cpt.y, button: 0, pointerId: 1, bubbles: true }));
      doc.dispatchEvent(new PointerEvent('pointerup', { clientX: cpt.x, clientY: cpt.y, button: 0, pointerId: 1, bubbles: true }));
      const drawn = canvasApi.ctx.getImageData(target.x, target.y, 1, 1).data;
      const drewAtZoom = drawn[0] > 180 && drawn[1] < 80 && drawn[2] < 80;
      const undoClearsDraw = (() => {
        const before = canvasApi.snapshot();
        canvasApi.restoreSnapshot(state.undoStack[state.undoStack.length - 1] || before);
        const px = canvasApi.ctx.getImageData(target.x, target.y, 1, 1).data;
        return px[0] > 240 && px[1] > 240 && px[2] > 240;
      })();
      canvasApi.setZoom(1);

      // --- XSS: значення з імпортованих об'єктів екрануються в DOM ---
      state.objects = [{ id: 'x"1', kind: 'stamp', stamp: '<img src=x onerror=alert(1)>', x: 10, y: 10, w: 50, h: 50, opacity: 100 }];
      canvasApi.renderObjects();
      const layerHtml = doc.getElementById('objectLayer').innerHTML;
      const xssEscaped = !layerHtml.includes('<img src=x') && layerHtml.includes('&lt;img');
      state.objects = [];
      state.selectedObjectId = null;
      canvasApi.renderObjects();

      // --- Ітерація 3: tool registry, піпетка, поворот, відзеркалення ---
      const hasRegistry = typeof win.ArtMalyunky.paintTools?.createPaintTools === 'function'
        && !!doc.querySelector('.rail-tool[data-tool="eyedropper"]');

      // Піпетка бере колір пікселя через реальний pointer-pipeline.
      canvasApi.setDocumentSize(400, 300, { clear: true });
      canvasApi.ctx.fillStyle = '#1188cc';
      canvasApi.ctx.fillRect(0, 0, 400, 300);
      state.currentTool = 'eyedropper';
      canvasApi.setZoom(1);
      const epoint = canvasApi.docToClient(50, 50);
      canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: epoint.x, clientY: epoint.y, button: 0, pointerId: 2, bubbles: true }));
      doc.dispatchEvent(new PointerEvent('pointerup', { clientX: epoint.x, clientY: epoint.y, button: 0, pointerId: 2, bubbles: true }));
      const eyedropperPicked = String(state.currentColor).toLowerCase() === '#1188cc';

      // Поворот 90° міняє розміри документа місцями.
      canvasApi.setDocumentSize(800, 600, { clear: true });
      canvasApi.rotate90('cw');
      const rotateSwapsDims = canvasApi.canvas.width === 600 && canvasApi.canvas.height === 800;

      // Відзеркалення переносить піксель на протилежний край.
      canvasApi.setDocumentSize(200, 120, { clear: true });
      canvasApi.ctx.fillStyle = '#ff0000';
      canvasApi.ctx.fillRect(10, 12, 6, 6);
      canvasApi.flip('horizontal');
      const flippedPx = canvasApi.ctx.getImageData(187, 14, 1, 1).data;
      const flipWorks = flippedPx[0] > 180 && flippedPx[1] < 80 && flippedPx[2] < 80;

      // --- Виділення: copy / delete / paste + pointer-маркер ---
      canvasApi.setDocumentSize(200, 200, { clear: true });
      canvasApi.ctx.fillStyle = '#ff0000';
      canvasApi.ctx.fillRect(20, 20, 30, 30);
      state.selection = { x: 20, y: 20, w: 30, h: 30, floating: null };
      const selBuffer = canvasApi.copySelectionToBuffer();
      const selectionCopies = !!selBuffer && selBuffer.width === 30 && selBuffer.height === 30;
      canvasApi.deleteSelection();
      const selDelPx = canvasApi.ctx.getImageData(30, 30, 1, 1).data;
      const selectionDeletes = selDelPx[0] > 240 && selDelPx[1] > 240 && selDelPx[2] > 240;
      canvasApi.pasteBuffer(selBuffer);
      const selPastePx = canvasApi.ctx.getImageData(5, 5, 1, 1).data;
      const selectionPastes = selPastePx[0] > 180 && selPastePx[1] < 80 && selPastePx[2] < 80;
      canvasApi.flattenSelection();

      state.currentTool = 'select';
      canvasApi.setZoom(1);
      const sa = canvasApi.docToClient(40, 40);
      const sb = canvasApi.docToClient(95, 85);
      canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: sa.x, clientY: sa.y, button: 0, pointerId: 3, bubbles: true }));
      canvas.dispatchEvent(new PointerEvent('pointermove', { clientX: sb.x, clientY: sb.y, button: 0, pointerId: 3, bubbles: true }));
      doc.dispatchEvent(new PointerEvent('pointerup', { clientX: sb.x, clientY: sb.y, button: 0, pointerId: 3, bubbles: true }));
      const marqueeCreated = !!state.selection && state.selection.w >= 50 && state.selection.h >= 40;
      state.selection = null;
      canvasApi.drawSelectionOverlay();
      state.currentTool = 'brush';
      canvasApi.setZoom(1);

      // --- Crop до виділення ---
      canvasApi.setDocumentSize(200, 200, { clear: true });
      canvasApi.ctx.fillStyle = '#ff0000';
      canvasApi.ctx.fillRect(50, 50, 60, 40);
      state.selection = { x: 50, y: 50, w: 60, h: 40, floating: null };
      canvasApi.cropToSelection();
      const cropPx = canvasApi.ctx.getImageData(10, 10, 1, 1).data;
      const cropWorks = canvasApi.canvas.width === 60 && canvasApi.canvas.height === 40
        && cropPx[0] > 180 && cropPx[1] < 80 && cropPx[2] < 80;

      // --- Масштабування зображення ---
      canvasApi.setDocumentSize(100, 80, { clear: true });
      canvasApi.ctx.fillStyle = '#00aa00';
      canvasApi.ctx.fillRect(0, 0, 100, 80);
      canvasApi.resizeDocument(200, 160, { scale: true });
      const scalePx = canvasApi.ctx.getImageData(150, 120, 1, 1).data;
      const scaleWorks = canvasApi.canvas.width === 200 && canvasApi.canvas.height === 160
        && scalePx[1] > 120 && scalePx[0] < 120;
      canvasApi.setZoom(1);

      // --- Чернетка через storage-шар (IndexedDB з fallback на localStorage) ---
      // Перевіряємо ДЕТЕРМІНОВАНО: підключення модуля + логіку звірки записів.
      // Живий IDB round-trip нестабільний у headless (virtual-time), тож його
      // покриває ідентичний код у slides-behavior; тут уникаємо флаку.
      const storage = win.ArtMalyunky.paintStorage;
      const storageWired = typeof storage.saveDraft === 'function'
        && typeof storage.loadDraft === 'function'
        && typeof storage.clearDraft === 'function';
      const tieAt = 1000;
      const tombstoneWins = storage.chooseNewerDraftRecord({ savedAt: tieAt, payload: { p: 'stale' } }, { savedAt: tieAt, payload: null });
      const newerWins = storage.chooseNewerDraftRecord({ savedAt: 2, payload: { p: 'new' } }, { savedAt: 1, payload: { p: 'old' } });
      const storageReconciles = tombstoneWins?.payload === null && newerWins?.payload?.p === 'new';

      // --- Прозорість (Етап 7) ---
      canvasApi.setDocumentSize(100, 100, { clear: true, transparent: true });
      const stageTransparentClass = doc.getElementById('canvasStage').classList.contains('transparent-doc');
      canvasApi.ctx.fillStyle = '#ff0000';
      canvasApi.ctx.fillRect(0, 0, 100, 100);
      state.currentSize = 40;
      state.lastX = 50;
      state.lastY = 50;
      canvasApi.erase(50, 50);
      const eraserClearsAlpha = canvasApi.ctx.getImageData(50, 50, 1, 1).data[3] < 40;
      const transparentComposite = canvasApi.exportMergedCanvas({ flatten: false });
      const exportKeepsAlpha = transparentComposite.getContext('2d').getImageData(50, 50, 1, 1).data[3] < 40;
      canvasApi.setDocumentSize(100, 100, { clear: true, transparent: false });
      const stageOpaqueClass = !doc.getElementById('canvasStage').classList.contains('transparent-doc');
      state.currentSize = 6;
      state.currentTool = 'brush';

      // --- Текстовий інструмент: запікання тексту в растр ---
      const hasTextTool = !!doc.querySelector('.rail-tool[data-tool="text"]') && !!doc.getElementById('propText');
      canvasApi.setDocumentSize(200, 100, { clear: true, transparent: false });
      canvasApi.drawText({ text: 'Hi', x: 10, y: 8, fontSize: 48, fontFamily: 'sans-serif', bold: true, italic: false, color: '#000000', opacity: 100 });
      let darkFound = false;
      const textData = canvasApi.ctx.getImageData(8, 6, 90, 70).data;
      for (let i = 0; i < textData.length; i += 4) {
        if (textData[i] < 100 && textData[i + 1] < 100 && textData[i + 2] < 100 && textData[i + 3] > 200) { darkFound = true; break; }
      }
      const textBakes = darkFound;

      // --- Основний / додатковий колір (ліва / права кнопка миші) ---
      const hasFgBgUI = !!doc.getElementById('foregroundChip') && !!doc.getElementById('backgroundChip') && !!doc.getElementById('swapColorsBtn');
      canvasApi.setDocumentSize(100, 100, { clear: true });
      state.currentTool = 'brush';
      state.currentBrush = 'pen';
      state.currentColor = '#ff0000';
      state.backgroundColor = '#0000ff';
      state.currentSize = 16;
      canvasApi.setZoom(1);
      const bgPt = canvasApi.docToClient(50, 50);
      canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: bgPt.x, clientY: bgPt.y, button: 2, pointerId: 5, bubbles: true }));
      doc.dispatchEvent(new PointerEvent('pointerup', { clientX: bgPt.x, clientY: bgPt.y, button: 2, pointerId: 5, bubbles: true }));
      const bgDrawn = canvasApi.ctx.getImageData(50, 50, 1, 1).data;
      const rightClickUsesBackground = bgDrawn[2] > 180 && bgDrawn[0] < 80;
      state.currentColor = '#112233';
      state.backgroundColor = '#ccddee';
      canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'x', bubbles: true }));
      const swapWorks = state.currentColor === '#ccddee' && state.backgroundColor === '#112233';
      state.currentColor = '#1f2937';
      state.backgroundColor = '#ffffff';
      state.activeColor = null;
      state.currentTool = 'brush';

      const checks = baseChecks.concat([
        check('setDocumentSize sets dimensions', sizeSet),
        check('window resize keeps document size', docStableAfterResize),
        check('window resize keeps raster intact', rasterStableAfterResize),
        check('fit-to-window keeps document pixels', fitKeepsPixels),
        check('coordinates consistent across zoom', coordsConsistent),
        check('undo restores document size', undoRestoresSize),
        check('tool rail rendered', hasRail),
        check('properties panel rendered', hasProps),
        check('contextual prop sections toggle by tool', contextualSections),
        check('drawing at zoom hits correct pixel', drewAtZoom),
        check('synchronous undo reverts stroke', undoClearsDraw),
        check('object values escaped against XSS', xssEscaped),
        check('tool registry and eyedropper present', hasRegistry),
        check('eyedropper picks pixel color', eyedropperPicked),
        check('rotate 90 swaps document dimensions', rotateSwapsDims),
        check('flip mirrors raster', flipWorks),
        check('selection copies region', selectionCopies),
        check('selection delete clears region', selectionDeletes),
        check('selection paste restores pixels', selectionPastes),
        check('marquee created via pointer drag', marqueeCreated),
        check('crop to selection resizes and keeps pixels', cropWorks),
        check('image scaling resizes content', scaleWorks),
        check('draft storage layer wired (IndexedDB + reconciliation)', storageWired && storageReconciles),
        check('transparent document shows checkerboard stage', stageTransparentClass && stageOpaqueClass),
        check('eraser clears alpha on transparent document', eraserClearsAlpha),
        check('PNG export keeps alpha for transparent document', exportKeepsAlpha),
        check('text tool and panel present', hasTextTool),
        check('text bakes into raster', textBakes),
        check('foreground/background colors UI present', hasFgBgUI),
        check('right button draws with background color', rightClickUsesBackground),
        check('X swaps foreground and background', swapWorks)
      ]);

      result.className = 'pass';
      result.textContent = checks.join('\n') + '\n\nPASSED';
      document.body.dataset.paintBehavior = 'passed';
    }

    run().catch(error => {
      result.className = 'fail';
      result.textContent = String(error && error.stack || error);
      document.body.dataset.paintBehavior = 'failed';
    });
  </script>
</body>
</html>
