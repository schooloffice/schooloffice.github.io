<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Tables Storage and Viewport Behavior</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; }
    iframe { width: 1050px; height: 700px; border: 1px solid #cbd5e1; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <pre id="result">Running...</pre>
  <iframe id="frame" src="about:blank"></iframe>
  <script>
    const result = document.getElementById('result');
    const frame = document.getElementById('frame');
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const check = (label, ok) => ({ label, ok: !!ok });

    function waitFor(predicate, label, timeout = 10000) {
      const started = performance.now();
      return new Promise((resolve, reject) => {
        function tick() {
          let ok = false;
          try { ok = !!predicate(); } catch { ok = false; }
          if (ok) return resolve();
          if (performance.now() - started > timeout) return reject(new Error(`Timed out waiting for ${label}`));
          setTimeout(tick, 50);
        }
        tick();
      });
    }

    async function run() {
      const legacy = {
        sheets: [{
          name: 'Стара таблиця', rows: 60, cols: 30,
          cellData: { A1: 'legacy' }, cellStyles: {}, colWidths: {}, condRules: []
        }],
        activeSheet: 0
      };
      localStorage.clear();
      localStorage.setItem('kom_sheets', JSON.stringify(legacy));
      frame.src = '../tables/index.html';
      await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      await waitFor(() => win.TablesApp?.ready, 'Tables ready promise');
      await win.TablesApp.ready;

      const checks = [];
      checks.push(check('legacy LocalStorage workbook migrates during async boot', doc.getElementById('inp_A1')?.value === 'legacy'));
      checks.push(check('legacy keys are removed after successful migration', localStorage.getItem('kom_sheets') === null));

      const a1 = doc.getElementById('inp_A1');
      a1.focus();
      a1.value = 'saved while typing';
      a1.dispatchEvent(new win.Event('input', { bubbles: true }));
      await wait(400);
      await win.TablesStorage.flushStateToStorage();
      const stored = await win.OfficeStorage.createDraftStore({ app: 'tables', key: 'tables' }).load();
      checks.push(check('cell input persists before blur through the 250 ms queue', stored?.sheets?.[0]?.cellData?.A1 === 'saved while typing'));

      const lastColumn = win.TablesAddressing.indexToCol(199);
      const largePayload = {
        type: 'art-tables-workbook', version: 2, name: 'Великий аркуш', activeSheet: 0,
        sheets: [{
          name: 'Аркуш1', rows: 500, cols: 200,
          cellData: { A1: '41', [`${lastColumn}500`]: '=A1+1' },
          cellStyles: {}, colWidths: {}, condRules: []
        }]
      };
      win.TablesWorkbookFile.importWorkbookText(JSON.stringify(largePayload));
      await wait(250);

      const renderedInputs = () => doc.querySelectorAll('.cell-input').length;
      checks.push(check('500 by 200 sheet keeps fewer than 3000 inputs in the DOM',
        win.TablesGridViewport.isVirtualized() && renderedInputs() > 0 && renderedInputs() < 3000));
      checks.push(check('formula result is calculated while its cell is not rendered',
        !doc.getElementById(`inp_${lastColumn}500`) && win.TablesCalculation.getCalculatedCellValue(`${lastColumn}500`) === 42));

      const nameBox = doc.getElementById('activeCellRef');
      nameBox.value = `${lastColumn}500`;
      nameBox.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
      await wait(250);
      checks.push(check('name box scrolls to and focuses the last model cell',
        doc.activeElement?.id === `inp_${lastColumn}500`
        && doc.getElementById(`inp_${lastColumn}500`)?.value === '42'
        && renderedInputs() < 3000));

      nameBox.value = 'A1';
      nameBox.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
      await wait(150);
      doc.getElementById('inp_A1')?.dispatchEvent(new win.KeyboardEvent('keydown', {
        key: 'End', ctrlKey: true, bubbles: true, cancelable: true
      }));
      await wait(250);
      checks.push(check('Ctrl+End navigates from A1 to the last cell through the viewport',
        doc.activeElement?.id === `inp_${lastColumn}500` && renderedInputs() < 3000));

      checks.push(check('CSV text formula injection is prefixed safely', win.protectCSVText('=CMD("x")') === "'=CMD(\"x\")"));
      checks.push(check('CSV plus injection is prefixed safely', win.protectCSVText('+SUM(A1:A2)') === "'+SUM(A1:A2)"));
      checks.push(check('CSV minus injection is prefixed safely', win.protectCSVText('-1+1') === "'-1+1"));
      checks.push(check('CSV at injection is prefixed safely', win.protectCSVText('@IMPORT') === "'@IMPORT"));
      checks.push(check('computed formulas remain values rather than protected raw formulas',
        win.TablesCalculation.getCalculatedCellValue(`${lastColumn}500`) === 42));

      await win.TablesStorage.clearStateFromStorage();
      const cleared = await win.OfficeStorage.createDraftStore({ app: 'tables', key: 'tables' }).load();
      checks.push(check('clearStateFromStorage writes a shared-store tombstone', cleared === null));

      const failed = checks.filter(item => !item.ok);
      result.textContent = checks.map(item => `${item.ok ? 'PASS' : 'FAIL'} ${item.label}`)
        .concat(failed.length ? [`FAILED: ${failed.map(item => item.label).join('; ')}`] : ['PASSED'])
        .join('\n');
      document.body.dataset.tablesStorageViewport = failed.length ? 'failed' : 'passed';
      if (failed.length) throw new Error(failed.map(item => item.label).join('; '));
    }

    run().catch(error => {
      document.body.dataset.tablesStorageViewport = 'failed';
      result.textContent += `\n${error?.stack || error}`;
    });
  </script>
</body>
</html>
