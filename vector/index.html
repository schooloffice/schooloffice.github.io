<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:;">
  <title>ПЛЮС Вектор — векторний графічний редактор</title>
  <meta name="description" content="ПЛЮС Вектор — шкільний векторний графічний редактор у браузері без реєстрації.">
<link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../UI_TOKENS.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shell-overrides.css">
</head>

<body class="office-app" data-office-service="vector">
  <noscript>
    <p class="noscript-warning">Увімкніть JavaScript для роботи редактора.</p>
  </noscript>

  <div id="modalOverlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
      <div id="modalIcon" class="modal-icon"></div>
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalText" class="modal-text"></div>
      <div id="modalInputWrap" class="modal-input-wrap hidden">
        <textarea id="modalInput" class="modal-input" rows="5"></textarea>
      </div>
      <div class="modal-actions">
        <button id="modalCancel" class="modal-btn secondary hidden">Скасувати</button>
        <button id="modalConfirm" class="modal-btn primary">Гаразд</button>
      </div>
    </div>
  </div>

  <input id="projectFileInput" type="file" accept=".json,application/json" hidden>

  <header class="app-header office-header">
    <div class="header-left">
      <a href="../" class="back-link" aria-label="Повернутися до Офіс ПЛЮС" title="Офіс ПЛЮС">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div class="app-logo"><i class="fa-solid fa-bezier-curve"></i> ПЛЮС Вектор</div>
      <div class="file-name-wrap">
        <span id="dirtyDot" aria-hidden="true" title="Є незбережені зміни"></span>
        <span id="fileName" role="button" tabindex="0" title="Перейменувати файл">векторний_малюнок</span>
      </div>
    </div>
    <div class="header-right">
      <span id="saveBadge">Збережено ✓</span>
      <div class="header-actions" role="group" aria-label="Швидкі дії">
        <button class="header-btn" type="button" data-action="save-project" title="Зберегти проєкт (Ctrl+S)"><i class="fa-solid fa-floppy-disk"></i></button>
        <button class="header-btn" type="button" data-action="undo" title="Скасувати (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="header-btn" type="button" data-action="redo" title="Повернути (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </div>
  </header>

  <nav class="menubar office-menubar" aria-label="Головне меню">
    <div class="menu-item-wrap">
      <button class="menu-title" data-menu="file" aria-haspopup="true" aria-expanded="false">Файл</button>
      <div class="menu-dropdown" data-menu="file" role="menu">
        <button class="menu-item" data-action="new-project"><span><i class="fa-solid fa-file-circle-plus fa-fw"></i>
            Новий проєкт</span><span class="shortcut">Ctrl+N</span></button>
        <button class="menu-item" data-action="open-project"><span><i class="fa-solid fa-folder-open fa-fw"></i>
            Відкрити проєкт</span><span class="shortcut">Ctrl+O</span></button>
        <button class="menu-item" data-action="save-project"><span><i class="fa-solid fa-floppy-disk fa-fw"></i>
            Зберегти проєкт</span><span class="shortcut">Ctrl+S</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="export-svg"><span><i class="fa-solid fa-file-code fa-fw"></i> Експорт
            SVG</span></button>
        <button class="menu-item" data-action="export-png"><span><i class="fa-solid fa-file-image fa-fw"></i> Експорт
            PNG</span><span class="shortcut">Ctrl+Shift+S</span></button>
        <button class="menu-item" data-action="print"><span><i class="fa-solid fa-print fa-fw"></i> Друк</span><span
            class="shortcut">Ctrl+P</span></button>
      </div>
    </div>

    <div class="menu-item-wrap">
      <button class="menu-title" data-menu="edit" aria-haspopup="true" aria-expanded="false">Редагування</button>
      <div class="menu-dropdown" data-menu="edit" role="menu">
        <button class="menu-item" data-action="undo"><span><i class="fa-solid fa-rotate-left fa-fw"></i>
            Скасувати</span><span class="shortcut">Ctrl+Z</span></button>
        <button class="menu-item" data-action="redo"><span><i class="fa-solid fa-rotate-right fa-fw"></i>
            Повернути</span><span class="shortcut">Ctrl+Y</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="duplicate"><span><i class="fa-regular fa-clone fa-fw"></i>
            Дублювати</span><span class="shortcut">Ctrl+D</span></button>
        <button class="menu-item" data-action="delete-selected"><span><i class="fa-solid fa-trash fa-fw"></i> Видалити
            вибране</span><span class="shortcut">Delete</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="bring-front"><span><i class="fa-solid fa-layer-group fa-fw"></i> На
            передній план</span></button>
        <button class="menu-item" data-action="send-back"><span><i class="fa-solid fa-layer-group fa-fw"></i> На задній
            план</span></button>
        <button class="menu-item" data-action="edit-text"><span><i class="fa-solid fa-font fa-fw"></i> Змінити
            текст</span></button>
      </div>
    </div>

    <div class="menu-item-wrap">
      <button class="menu-title" data-menu="insert" aria-haspopup="true" aria-expanded="false">Вставка</button>
      <div class="menu-dropdown" data-menu="insert" role="menu">
        <button class="menu-item" data-action="set-tool-text"><span><i class="fa-solid fa-font fa-fw"></i> Текст</span></button>
        <button class="menu-item" data-action="set-tool-rect"><span><i class="fa-regular fa-square fa-fw"></i> Прямокутник</span></button>
        <button class="menu-item" data-action="set-tool-ellipse"><span><i class="fa-regular fa-circle fa-fw"></i> Еліпс</span></button>
        <button class="menu-item" data-action="set-tool-line"><span><i class="fa-solid fa-minus fa-fw"></i> Лінія</span></button>
        <button class="menu-item" data-action="set-tool-arrow"><span><i class="fa-solid fa-arrow-right fa-fw"></i> Стрілка</span></button>
      </div>
    </div>

    <div class="menu-item-wrap">
      <button class="menu-title" data-menu="format" aria-haspopup="true" aria-expanded="false">Формат</button>
      <div class="menu-dropdown" data-menu="format" role="menu">
        <button class="menu-item" data-action="bring-front"><span><i class="fa-solid fa-layer-group fa-fw"></i> На передній план</span></button>
        <button class="menu-item" data-action="send-back"><span><i class="fa-solid fa-layer-group fa-fw"></i> На задній план</span></button>
        <button class="menu-item" data-action="duplicate"><span><i class="fa-regular fa-clone fa-fw"></i> Дублювати</span><span class="shortcut">Ctrl+D</span></button>
        <button class="menu-item" data-action="edit-text"><span><i class="fa-solid fa-font fa-fw"></i> Змінити текст</span></button>
      </div>
    </div>

    <div class="menu-item-wrap">
      <button class="menu-title" data-menu="view" aria-haspopup="true" aria-expanded="false">Перегляд</button>
      <div class="menu-dropdown" data-menu="view" role="menu">
        <button class="menu-item" data-action="guide-none"><span><i class="fa-regular fa-square fa-fw"></i> Підкладка:
            немає</span></button>
        <button class="menu-item" data-action="guide-grid"><span><i class="fa-solid fa-border-all fa-fw"></i> Підкладка:
            сітка</span></button>
        <button class="menu-item" data-action="guide-lines"><span><i class="fa-solid fa-grip-lines fa-fw"></i>
            Підкладка: рядки</span></button>
        <div class="menu-sep"></div>
        <button id="snapToggleBtn" class="menu-item" data-action="toggle-snap"><span><i class="fa-solid fa-magnet fa-fw"></i> Прив'язка до
            сітки</span><span id="snapStateLabel" class="shortcut">Увімкнено</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="zoom-out"><span><i class="fa-solid fa-magnifying-glass-minus fa-fw"></i>
            Масштаб −</span></button>
        <button class="menu-item" data-action="zoom-reset"><span><i class="fa-solid fa-expand fa-fw"></i> Масштаб
            100%</span></button>
        <button class="menu-item" data-action="zoom-in"><span><i class="fa-solid fa-magnifying-glass-plus fa-fw"></i>
            Масштаб +</span></button>
        <button class="menu-item" data-action="fit-canvas"><span><i class="fa-solid fa-expand fa-fw"></i> Вмістити у
            вікно</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="toggle-panel"><span><i class="fa-solid fa-table-columns fa-fw"></i> Панель
            параметрів</span><span class="shortcut">Ctrl+\</span></button>
      </div>
    </div>

    <div class="menu-item-wrap">
      <button class="menu-title" data-menu="help" aria-haspopup="true" aria-expanded="false">Допомога</button>
      <div class="menu-dropdown" data-menu="help" role="menu">
        <button class="menu-item" data-action="show-help"><span><i class="fa-solid fa-circle-question fa-fw"></i>
            Довідка та поради</span></button>
        <button class="menu-item" data-action="show-shortcuts"><span><i class="fa-solid fa-keyboard fa-fw"></i>
            Клавіатурні скорочення</span></button>
        <button class="menu-item" data-action="show-about"><span><i class="fa-solid fa-circle-info fa-fw"></i> Про ПЛЮС
            Вектор</span></button>
      </div>
    </div>
  </nav>

  <div class="editor-body">
    <aside class="tool-rail office-toolbar" role="toolbar" aria-label="Інструменти">
      <!-- Стандартні команди лишаються в контракті shell, а видимі кнопки живуть
           у header і меню: rail віддано під інструменти. -->
      <div class="command-proxies" hidden>
        <button type="button" data-action="new-project" data-office-command="new"></button>
        <button type="button" data-action="open-project" data-office-command="open"></button>
        <button type="button" data-action="save-project" data-office-command="save"></button>
        <button type="button" data-action="undo" data-office-command="undo"></button>
        <button type="button" data-action="redo" data-office-command="redo"></button>
      </div>

      <div class="rail-group rail-tools">
        <button class="rail-btn rail-tool active" type="button" data-tool="select" title="Вибір (V)"><i class="fa-solid fa-arrow-pointer"></i><span>Вибір</span></button>
        <button class="rail-btn rail-tool" type="button" data-tool="pen" title="Олівець (P)"><i class="fa-solid fa-pencil"></i><span>Олівець</span></button>
        <button id="railLineBtn" class="rail-btn rail-tool" type="button" data-tool-group="line" title="Лінія та стрілка (L)"><i id="railLineIcon" class="fa-solid fa-minus"></i><span>Лінія</span></button>
        <button id="railShapeBtn" class="rail-btn rail-tool" type="button" data-tool-group="shape" title="Фігури (R)"><i id="railShapeIcon" class="fa-regular fa-square"></i><span>Фігури</span></button>
        <button class="rail-btn rail-tool" type="button" data-tool="text" title="Текст (T)"><i class="fa-solid fa-font"></i><span>Текст</span></button>
      </div>

      <div class="rail-group rail-panel-toggle">
        <button id="panelToggleBtn" class="rail-btn" type="button" data-action="toggle-panel" aria-expanded="true" aria-controls="propertiesPanel" title="Згорнути панель параметрів (Ctrl+\)"><i id="panelToggleIcon" class="fa-solid fa-chevron-left"></i><span>Панель</span></button>
      </div>
    </aside>

    <aside id="propertiesPanel" class="properties-panel" aria-label="Параметри інструмента">
      <!-- Верхня зона змінюється разом з інструментом, нижня (кольори, контур,
           прозорість, підкладка) однакова завжди і притиснута до низу панелі. -->
      <div class="panel-tool-area">
      <!-- Іконки геометричних примітивів самі є підписом; назву активного вибору
           показує заголовок секції, тож підпис лишається видимим завжди. -->
      <div id="propLine" class="prop-section" data-tool-section="line">
        <div class="prop-title">Лінія <span id="lineToolName" class="prop-title-value">Лінія</span></div>
        <div class="chip-grid chip-grid-icons">
          <button class="prop-chip" type="button" data-tool="line" title="Лінія" aria-label="Лінія"><i class="fa-solid fa-minus"></i></button>
          <button class="prop-chip" type="button" data-tool="arrow" title="Стрілка" aria-label="Стрілка"><i class="fa-solid fa-arrow-right-long"></i></button>
        </div>
      </div>

      <div id="propShape" class="prop-section" data-tool-section="shape">
        <div class="prop-title">Фігура <span id="shapeToolName" class="prop-title-value">Прямокутник</span></div>
        <div class="chip-grid chip-grid-icons">
          <button class="prop-chip" type="button" data-tool="rect" title="Прямокутник" aria-label="Прямокутник"><i class="fa-regular fa-square"></i></button>
          <button class="prop-chip" type="button" data-tool="ellipse" title="Еліпс" aria-label="Еліпс"><i class="fa-regular fa-circle"></i></button>
          <button class="prop-chip" type="button" data-tool="triangle" title="Трикутник" aria-label="Трикутник"><i class="fa-solid fa-play fa-rotate-270"></i></button>
          <button class="prop-chip" type="button" data-tool="diamond" title="Ромб" aria-label="Ромб"><i class="fa-regular fa-gem"></i></button>
          <button class="prop-chip" type="button" data-tool="star" title="Зірка" aria-label="Зірка"><i class="fa-solid fa-star"></i></button>
        </div>
      </div>

      <div id="propText" class="prop-section" data-tool-section="text">
        <div class="prop-title">Розмір тексту <span id="fontSizeValue" class="value-badge">32 px</span></div>
        <input id="fontSizeSlider" type="range" min="12" max="96" step="2" value="32" aria-label="Розмір шрифту">
      </div>

      <div id="propObject" class="prop-section prop-object">
        <div class="prop-title">Об'єкт <span id="selectionState" class="prop-title-value"></span></div>
        <div class="panel-actions-grid">
          <button class="panel-action" type="button" data-action="bring-front" title="На передній план"><i class="fa-solid fa-arrow-up-wide-short"></i><span>Вперед</span></button>
          <button class="panel-action" type="button" data-action="send-back" title="На задній план"><i class="fa-solid fa-arrow-down-short-wide"></i><span>Назад</span></button>
          <button class="panel-action" type="button" data-action="duplicate" title="Дублювати (Ctrl+D)"><i class="fa-regular fa-clone"></i><span>Дублювати</span></button>
          <button class="panel-action" type="button" data-action="edit-text" title="Змінити текст"><i class="fa-solid fa-pen-to-square"></i><span>Текст…</span></button>
          <button class="panel-action danger" type="button" data-action="delete-selected" title="Видалити вибране (Delete)"><i class="fa-solid fa-trash"></i><span>Видалити</span></button>
        </div>
      </div>

      </div>

      <div class="panel-common">
        <div class="prop-section prop-colors">
          <div class="prop-title">Кольори</div>
          <div class="color-targets">
            <button id="strokeTargetBtn" class="color-target active" type="button" title="Колір контуру">
              <span id="strokePreview" class="color-chip stroke-chip"></span>
              <span class="color-target-label">Контур</span>
            </button>
            <button id="fillTargetBtn" class="color-target" type="button" title="Колір заливки">
              <span id="fillPreview" class="color-chip fill-chip"></span>
              <span class="color-target-label">Заливка</span>
            </button>
          </div>
          <div id="colorPalette" class="inline-palette" aria-label="Основна палітра кольорів"></div>
          <div class="color-extra">
            <button id="noFillBtn" class="mini-btn" type="button" title="Без заливки"><i class="fa-solid fa-ban"></i><span>Без заливки</span></button>
            <label class="custom-color-btn" title="Власний колір">
              <i class="fa-solid fa-droplet"></i>
              <input id="nativeColorPicker" type="color" value="#1f2937" aria-label="Власний колір">
            </label>
          </div>
        </div>

        <div class="prop-section">
          <div class="prop-title">Контур <span id="strokeWidthValue" class="value-badge">3 px</span></div>
          <input id="strokeWidthSlider" type="range" min="1" max="18" step="1" value="3" aria-label="Товщина контуру">
        </div>

        <div class="prop-section">
          <div class="prop-title">Прозорість <span id="opacityValue" class="value-badge">100%</span></div>
          <input id="opacitySlider" type="range" min="10" max="100" step="5" value="100" aria-label="Непрозорість">
        </div>

        <div class="prop-section">
          <div class="prop-title">Підкладка</div>
          <div class="segmented guide-control" role="group" aria-label="Підкладка">
            <button class="segmented-btn" type="button" data-guide="none" title="Без підкладки"><i class="fa-regular fa-square"></i></button>
            <button class="segmented-btn active" type="button" data-guide="grid" title="Сітка"><i class="fa-solid fa-border-all"></i></button>
            <button class="segmented-btn" type="button" data-guide="lines" title="Рядки"><i class="fa-solid fa-grip-lines"></i></button>
          </div>
        </div>
      </div>
    </aside>

    <main class="workspace office-workspace office-workspace-focusable" tabindex="0">
      <section class="canvas-area">
        <div id="canvasScroller" class="canvas-scroller">
          <div id="artboardWrap" class="artboard-wrap">
            <svg id="drawingSvg" class="drawing-svg" xmlns="http://www.w3.org/2000/svg" width="1200" height="700"
              viewBox="0 0 1200 700" aria-label="Векторне полотно">
              <defs>
                <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"
                  markerUnits="strokeWidth">
                  <path d="M0,0 L12,6 L0,12 z" fill="currentColor"></path>
                </marker>
              </defs>
              <rect class="board-bg" x="0" y="0" width="1200" height="700" fill="#ffffff"></rect>
              <g id="guideLayer"></g>
              <g id="contentLayer"></g>
              <g id="selectionLayer"></g>
            </svg>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="statusbar office-statusbar" aria-label="Рядок стану">
    <span id="statusCoords" data-office-status-slot="meta">X: 0, Y: 0</span>
    <span id="statusTool" data-office-status-slot="primary">Інструмент: Вибір</span>
    <span id="statusSelection" data-office-status-slot="secondary">Вибрано: нічого</span>
    <span id="statusStyle" data-office-status-slot="style">Контур: #1F2937 · Заливка: немає</span>
    <span id="statusZoom" class="status-hidden-metric" data-office-status-slot="zoom">Масштаб: 100%</span>
    <span id="statusCanvas" data-office-status-slot="canvas">Полотно: 1200 × 700</span>
    <span class="status-zoom" role="group" aria-label="Масштаб">
      <button class="zoom-btn" type="button" data-action="zoom-out" title="Зменшити масштаб (Ctrl+-)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      <button id="zoomValueBtn" class="zoom-btn zoom-value" type="button" data-action="zoom-reset" title="Масштаб 100% (Ctrl+0)">100%</button>
      <button class="zoom-btn" type="button" data-action="zoom-in" title="Збільшити масштаб (Ctrl++)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      <button class="zoom-btn" type="button" data-action="fit-canvas" title="Вмістити у вікно"><i class="fa-solid fa-expand"></i></button>
    </span>
  </footer>

  <script src="js/constants.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/project-io.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/runtime.js"></script>
  <script src="../office-shell.js"></script>
  <script src="../office-ui.js"></script>
  <script src="../offline.js"></script>
</body>

</html>
